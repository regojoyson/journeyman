server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy /api → api-server:4000
  # Use a variable so nginx defers DNS lookup until request time — lets
  # the config test pass even when the upstream isn't resolvable yet.
  resolver 127.0.0.11 ipv6=off valid=30s;
  location /api/ {
    set $upstream_api "http://api-server:4000";
    # No trailing slash: the backend registers routes WITH the /api prefix
    # (e.g. /api/bootstrap/status), so forward the path unchanged — don't strip /api/.
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE support
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
