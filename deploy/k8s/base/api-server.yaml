apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  selector:
    app: api-server
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -U postgres; do echo "waiting for postgres"; sleep 2; done'
      containers:
        - name: api-server
          image: journeyman/api-server:dev
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: journeyman-config
            - secretRef:
                name: journeyman-secrets
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
