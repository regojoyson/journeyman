# infra/compose.dev.yml — DEV dependency stack only: Postgres + Redis + Conductor.
# Run with: npm run infra:up / infra:down / infra:reset
# You then run api-server/worker/web on your host via npm. For the full
# containerized stack (incl. apps + dind) see compose.deploy.yml at the repo root.
#
# NOTE: the api-server is NOT containerized in dev, so app config — including the
# Builder LLM (BUILDER_LLM_*, e.g. LM Studio at http://localhost:1234/v1) — lives
# in the repo-root .env, read by the host-run api-server. Nothing to set here.
name: journeyman-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journeyman
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  conductor:
    image: orkesio/orkes-conductor-community-standalone:latest
    ports:
      - "8080:8080"   # Conductor REST API
      - "5001:5000"   # Conductor UI (5000 is taken by macOS AirPlay Receiver)
    environment:
      - CONFIG_PROP=/app/config/conductor.properties
    volumes:
      - ./conductor-config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Local registry for the runner kit during host-based dev (npm run start:worker).
  # The host Docker daemon both pushes (build:kit) and pulls (sandbox provisioning),
  # so a plain published registry works — no dind namespace tricks needed.
  # Published on 5500 because macOS AirPlay Receiver squats on 5000 (see conductor).
  # Set JOURNEYMAN_REGISTRY=localhost:5500 in your .env for local dev.
  registry:
    image: registry:2
    ports: ["5500:5000"]
    volumes:
      - registry-data:/var/lib/registry

  # Bridges the host Docker socket to TCP so a host-run worker (npm run start:worker) can
  # drive the host Docker daemon for docker-backend sandboxes. Set the sandbox's daemon
  # host to tcp://localhost:2375. Bound to loopback only.
  # SECURITY: unauthenticated Docker API (root-equivalent on the host) — never expose
  # beyond 127.0.0.1.
  dockerproxy:
    image: alpine/socat
    # -t86400: after one direction of the relay reaches EOF, wait this long (vs socat's
    # 0.5s default) before closing the other. The worker's Docker `exec` is a HIJACKED
    # bidirectional stream: dockerode writes the runner's stdin then half-closes it, but
    # the runner needs seconds (boot opencode, run the model) before it writes its JSON
    # response on stdout. With the 0.5s default, socat tore down the stdout direction
    # before that response arrived → "runner produced no JSON (exit -1)". Keep it large.
    command: ["-t86400", "tcp-listen:2375,fork,reuseaddr", "unix-connect:/var/run/docker.sock"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:2375:2375"]
    restart: unless-stopped

volumes:
  pgdata:
  registry-data:
