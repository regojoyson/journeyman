  <text x="32" y="159" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#8B5CF6">Fastify</text>
  <line x1="186" y1="120" x2="186" y2="174" stroke="#DDD6FE" stroke-width="1"/>
  <rect x="196" y="130" width="112" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="252" y="147" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#5B21B6" text-anchor="middle">api-server</text>
  <text x="317" y="147" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#7C3AED">REST + SSE · auth · validation · routing</text>

