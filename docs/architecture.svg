  <text x="32" y="47" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#1D4ED8">Web UI</text>
  <text x="32" y="63" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#60A5FA">React · XYFlow</text>
  <!-- divider -->
  <line x1="186" y1="20" x2="186" y2="94" stroke="#BFDBFE" stroke-width="1"/>
  <!-- chips -->
  <rect x="196" y="30" width="68" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="230" y="47" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">web</text>
  <rect x="272" y="30" width="112" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="328" y="47" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">flow-editor</text>
  <rect x="392" y="30" width="106" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="445" y="47" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">run-viewer</text>
  <rect x="506" y="30" width="96" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="554" y="47" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">runs-list</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="98" x2="400" y2="108" stroke="#CBD5E1" stroke-width="1.5"/>
  <polygon points="393,108 407,108 400,116" fill="#CBD5E1"/>

