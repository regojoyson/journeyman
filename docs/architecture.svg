  <!-- row 2 -->
  <rect x="196" y="324" width="162" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="277" y="341" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#92400E" text-anchor="middle">notification-provider</text>
  <rect x="366" y="324" width="60" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="396" y="341" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#92400E" text-anchor="middle">mcp</text>
  <rect x="434" y="324" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="472" y="341" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#92400E" text-anchor="middle">skills</text>
  <rect x="518" y="324" width="130" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="583" y="341" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#92400E" text-anchor="middle">custom-phases</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="372" x2="400" y2="382" stroke="#CBD5E1" stroke-width="1.5"/>
  <polygon points="393,382 407,382 400,390" fill="#CBD5E1"/>

