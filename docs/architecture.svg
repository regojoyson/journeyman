  ══════════════════════════════════════════════════ -->
  <rect x="16" y="196" width="768" height="62" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="32" y="223" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#064E3B">Orchestrator</text>
  <text x="32" y="239" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#34D399">Conductor</text>
  <line x1="186" y1="200" x2="186" y2="254" stroke="#A7F3D0" stroke-width="1"/>
  <rect x="196" y="210" width="126" height="26" rx="13" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
