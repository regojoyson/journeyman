<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" width="800" height="468">

  <!-- Canvas background -->
  <rect width="800" height="468" fill="#F8FAFC" rx="12"/>

  <!-- ═══════════════════════════════════════════════
       LAYER 1 — Web UI  (y=16, h=82)
  ══════════════════════════════════════════════════ -->
  <rect x="16" y="16" width="768" height="82" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
