  <text x="346" y="421" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#9F1239" text-anchor="middle">Redis</text>

  <!-- footnote -->
  <text x="784" y="460" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#94A3B8" text-anchor="end">all packages prefixed @journeyman/</text>

</svg>
