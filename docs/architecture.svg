       LAYER 5 — Storage  (y=390, h=62)
  ══════════════════════════════════════════════════ -->
  <rect x="16" y="390" width="768" height="62" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
  <text x="32" y="417" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#881337">Storage</text>
  <text x="32" y="433" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#FB7185">PostgreSQL · Redis</text>
  <line x1="186" y1="394" x2="186" y2="448" stroke="#FECDD3" stroke-width="1"/>
  <rect x="196" y="404" width="106" height="26" rx="13" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1"/>
  <text x="249" y="421" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#9F1239" text-anchor="middle">PostgreSQL</text>
