  <!-- row 1 -->
  <rect x="196" y="288" width="82" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="237" y="305" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#92400E" text-anchor="middle">phases</text>
  <rect x="286" y="288" width="100" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
