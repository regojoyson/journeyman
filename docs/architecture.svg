       LAYER 2 — API Gateway  (y=116, h=62)
  ══════════════════════════════════════════════════ -->
  <rect x="16" y="116" width="768" height="62" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
