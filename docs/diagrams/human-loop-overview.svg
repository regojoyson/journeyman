<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 730"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#475569"/></marker>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#f97316"/></marker>
    <marker id="av" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1040" height="730" fill="#f8fafc"/>

  <!-- Title -->
  <text x="520" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Human Review Loop — Pipeline Overview</text>
  <text x="520" y="54" text-anchor="middle" font-size="11" fill="#64748b">The same reviewLoop phase reused for analyze gate · plan gate · code-review gate</text>

  <!-- ─── PIPELINE FLOW ──────────────────────────────────────── -->

  <!-- Row 1: ticket trigger → setup → analyze → [reviewLoop] -->

  <!-- Ticket trigger -->
  <rect x="36" y="82" width="130" height="48" rx="8" fill="#2563eb" filter="url(#sh)"/>
  <text x="101" y="106" text-anchor="middle" fill="white" font-weight="700" font-size="13">Ticket trigger</text>
  <text x="101" y="122" text-anchor="middle" fill="#bfdbfe" font-size="10">label / webhook / API</text>

  <line x1="166" y1="106" x2="186" y2="106" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Setup box -->
  <rect x="186" y="82" width="168" height="48" rx="8" fill="white" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="270" y="106" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">fetch · clone · checkout</text>
  <text x="270" y="122" text-anchor="middle" fill="#64748b" font-size="10">mark development-started</text>

  <line x1="354" y1="106" x2="374" y2="106" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Analyze box -->
  <rect x="374" y="82" width="130" height="48" rx="8" fill="white" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="439" y="106" text-anchor="middle" fill="#1e40af" font-weight="600" font-size="12">analyze</text>
  <text x="439" y="122" text-anchor="middle" fill="#64748b" font-size="10">AI code analysis</text>

  <line x1="504" y1="106" x2="524" y2="106" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- reviewLoop #1 -->
  <rect x="524" y="70" width="242" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="645" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">reviewLoop  ①</text>
  <text x="645" y="110" text-anchor="middle" font-size="10" fill="#b45309">approve: analyze-approved</text>
  <text x="645" y="126" text-anchor="middle" font-size="10" fill="#b45309">rework: [fetchTicketComments, analyze]</text>

  <!-- approved → down to plan row -->
  <path d="M 645 142 L 645 178 L 439 178 L 439 210" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="540" y="170" font-size="10" fill="#059669" font-style="italic">approved →</text>

  <!-- Row 2: plan → [reviewLoop] -->

  <!-- Plan box -->
  <rect x="374" y="214" width="130" height="48" rx="8" fill="white" stroke="#a5f3fc" stroke-width="1.5" filter="url(#sh)"/>
  <text x="439" y="238" text-anchor="middle" fill="#0e7490" font-weight="600" font-size="12">plan</text>
  <text x="439" y="254" text-anchor="middle" fill="#64748b" font-size="10">AI implementation plan</text>

  <line x1="504" y1="238" x2="524" y2="238" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- reviewLoop #2 -->
  <rect x="524" y="202" width="242" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="645" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">reviewLoop  ②</text>
  <text x="645" y="242" text-anchor="middle" font-size="10" fill="#b45309">approve: plan-approved</text>
  <text x="645" y="258" text-anchor="middle" font-size="10" fill="#b45309">rework: [fetchTicketComments, plan]</text>

  <!-- approved → down to implement row -->
  <path d="M 645 274 L 645 310 L 439 310 L 439 342" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="540" y="302" font-size="10" fill="#059669" font-style="italic">approved →</text>

  <!-- Row 3: implement → commit → PR → [reviewLoop] -->

  <!-- Implement box -->
  <rect x="374" y="346" width="130" height="48" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="439" y="370" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">implement</text>
  <text x="439" y="386" text-anchor="middle" fill="#15803d" font-size="10">AI code changes</text>

  <line x1="504" y1="370" x2="524" y2="370" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>

  <!-- Commit + PR box -->
  <rect x="524" y="346" width="188" height="48" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="618" y="370" text-anchor="middle" fill="#065f46" font-weight="600" font-size="12">commit · push · openPR</text>
  <text x="618" y="386" text-anchor="middle" fill="#15803d" font-size="10">auto-named branch · PR opened</text>

  <line x1="712" y1="370" x2="732" y2="370" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>

  <!-- reviewLoop #3 — code review -->
  <rect x="732" y="326" width="274" height="100" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="869" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">reviewLoop  ③  code review</text>
  <text x="869" y="370" text-anchor="middle" font-size="10" fill="#b45309">approve: completed  ·  maxCycles: 3</text>
  <text x="869" y="386" text-anchor="middle" font-size="10" fill="#b45309">rework: rework-requested</text>
  <text x="869" y="402" text-anchor="middle" font-size="10" fill="#b45309">onRework: [fetchPRComments, plan, implement, commitPushRepos]</text>

  <!-- approved → done -->
  <line x1="869" y1="426" x2="869" y2="468" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="881" y="452" font-size="10" fill="#059669" font-style="italic">approved →</text>

  <!-- Done -->
  <rect x="800" y="472" width="138" height="46" rx="8" fill="#059669" filter="url(#sh)"/>
  <text x="869" y="496" text-anchor="middle" fill="white" font-weight="700" font-size="13">notify → done</text>
  <text x="869" y="512" text-anchor="middle" fill="#d1fae5" font-size="10">cleanup repos</text>

  <!-- max cycles → failed -->
  <path d="M 1006 376 Q 1020 376 1020 520 L 960 520" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="1024" y="440" font-size="10" fill="#991b1b" transform="rotate(90,1024,440)">max cycles</text>
  <rect x="870" y="526" width="86" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="913" y="548" text-anchor="middle" fill="#7f1d1d" font-weight="700" font-size="11">run failed</text>

  <!-- ─── HUMAN LANE ───────────────────────────────────────────── -->
  <rect x="36" y="180" width="300" height="356" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="186" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Human reviewer</text>

  <text x="60" y="232" font-size="11" fill="#7c3aed">1.  Reads analysis / plan report or PR</text>
  <text x="60" y="254" font-size="11" fill="#7c3aed">2.  Optionally adds ticket comments</text>
  <text x="60" y="276" font-size="11" fill="#7c3aed">3.  Changes ticket status / label:</text>

  <rect x="60" y="288" width="256" height="86" rx="6" fill="white" stroke="#ede9fe" filter="url(#sh)"/>
  <text x="78" y="310" font-size="11" fill="#059669">• *-approved   →   proceed</text>
  <text x="78" y="330" font-size="11" fill="#f97316">• *-rework     →   re-run phases</text>
  <text x="78" y="350" font-size="11" fill="#dc2626">• failed        →   fail run</text>
  <text x="78" y="366" font-size="9" fill="#94a3b8" font-style="italic">(unknown status → stays blocked)</text>

  <line x1="186" y1="388" x2="186" y2="408" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="60" y="408" width="256" height="62" rx="6" fill="white" stroke="#ede9fe" filter="url(#sh)"/>
  <text x="186" y="427" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">webhook → dispatcher</text>
  <text x="186" y="444" text-anchor="middle" font-size="10" fill="#7c3aed">findActiveForTicket(productId, ticketKey)</text>
  <text x="186" y="460" text-anchor="middle" font-size="10" fill="#7c3aed">→ pipeline.resume(sessionId, {status})</text>

  <!-- Human → reviewLoop arrows (rework path) -->
  <path d="M 336 285 Q 470 285 522 238" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <path d="M 336 300 Q 480 300 522 108" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <path d="M 336 320 L 732 370" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="416" y="282" font-size="9" fill="#f97316" font-style="italic">status-change webhook</text>

  <!-- ─── LEGEND ────────────────────────────────────────────────── -->
  <rect x="36" y="598" width="966" height="116" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="56" y="622" font-size="12" font-weight="700" fill="#0f172a">Legend</text>

  <rect x="56" y="636" width="16" height="16" rx="3" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
  <text x="78" y="649" font-size="11" fill="#374151">reviewLoop — blocks run until ticket status changes; loops on rework</text>

  <rect x="56" y="664" width="16" height="16" rx="3" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="78" y="677" font-size="11" fill="#374151">Automated phase (analyze · plan · implement · git)</text>

  <rect x="56" y="692" width="16" height="16" rx="3" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="78" y="705" font-size="11" fill="#374151">Human lane — reads reports, adds comments, changes ticket status</text>

  <line x1="440" y1="644" x2="468" y2="644" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="474" y="649" font-size="11" fill="#374151">Rework path (status = *-rework) → re-run onRework sub-phases</text>

  <line x1="440" y1="672" x2="468" y2="672" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="474" y="677" font-size="11" fill="#374151">Approved path (status = *-approved) → pipeline advances</text>

  <line x1="440" y1="700" x2="468" y2="700" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="474" y="705" font-size="11" fill="#374151">Failure path (max cycles exceeded or sub-phase error)</text>
</svg>
