<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="#fafafa" rx="8"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Human Review Loop — Pipeline Overview</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#64748b">Same reviewLoop phase reused for analyze / plan / code gates</text>

  <!-- Start -->
  <rect x="40" y="80" width="130" height="40" rx="8" fill="#2563eb"/>
  <text x="105" y="104" text-anchor="middle" fill="white" font-weight="600">Ticket trigger</text>

  <!-- fetch + clone + checkout (collapsed) -->
  <rect x="200" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="285" y="104" text-anchor="middle" fill="#0369a1" font-weight="600">fetch • clone • checkout</text>

  <line x1="170" y1="100" x2="198" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- analyze -->
  <rect x="400" y="80" width="120" height="40" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="460" y="104" text-anchor="middle" fill="#0369a1" font-weight="600">analyze</text>
  <line x1="370" y1="100" x2="398" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- analyze-review -->
  <rect x="550" y="70" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="90" text-anchor="middle" fill="#92400e" font-weight="700">reviewLoop</text>
  <text x="650" y="106" text-anchor="middle" fill="#92400e" font-size="10">approve: analyze-approved</text>
  <text x="650" y="120" text-anchor="middle" fill="#92400e" font-size="10">rework: [fetchTicketComments, analyze]</text>
  <line x1="520" y1="100" x2="548" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- plan -->
  <rect x="400" y="200" width="120" height="40" rx="8" fill="#dbeafe" stroke="#1e40af"/>
  <text x="460" y="224" text-anchor="middle" fill="#1e40af" font-weight="600">plan</text>

  <!-- Arrow from analyze-review down to plan -->
  <path d="M 650 130 L 650 180 L 460 180 L 460 198" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="560" y="172" font-size="10" fill="#16a34a" font-style="italic">approved</text>

  <!-- plan-review -->
  <rect x="550" y="190" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="210" text-anchor="middle" fill="#92400e" font-weight="700">reviewLoop</text>
  <text x="650" y="226" text-anchor="middle" fill="#92400e" font-size="10">approve: plan-approved</text>
  <text x="650" y="240" text-anchor="middle" fill="#92400e" font-size="10">rework: [fetchTicketComments, plan]</text>
  <line x1="520" y1="220" x2="548" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- implement -->
  <rect x="400" y="320" width="120" height="40" rx="8" fill="#dcfce7" stroke="#166534"/>
  <text x="460" y="344" text-anchor="middle" fill="#166534" font-weight="600">implement</text>
  <path d="M 650 250 L 650 300 L 460 300 L 460 318" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="560" y="292" font-size="10" fill="#16a34a" font-style="italic">approved</text>

  <!-- commit-push + open-pr -->
  <rect x="550" y="320" width="170" height="40" rx="8" fill="#dcfce7" stroke="#166534"/>
  <text x="635" y="344" text-anchor="middle" fill="#166534" font-weight="600">commit • push • openPR</text>
  <line x1="520" y1="340" x2="548" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- code-review -->
  <rect x="330" y="420" width="390" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="525" y="442" text-anchor="middle" fill="#92400e" font-weight="700">reviewLoop (code review)</text>
  <text x="525" y="458" text-anchor="middle" fill="#92400e" font-size="10">approve: completed  •  rework: rework-requested  •  maxCycles: 3</text>
  <text x="525" y="475" text-anchor="middle" fill="#92400e" font-size="10">onRework: [fetchPRComments, plan, implement, commitPushRepos]</text>
  <path d="M 635 360 L 635 418" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- completed -->
  <rect x="780" y="435" width="110" height="40" rx="8" fill="#166534"/>
  <text x="835" y="459" text-anchor="middle" fill="white" font-weight="600">notify → done</text>
  <line x1="720" y1="455" x2="778" y2="455" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="748" y="448" font-size="10" fill="#16a34a" font-style="italic">approved</text>

  <!-- failed -->
  <rect x="780" y="495" width="110" height="36" rx="8" fill="#991b1b"/>
  <text x="835" y="517" text-anchor="middle" fill="white" font-weight="600">run failed</text>
  <path d="M 720 475 L 780 511" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="750" y="498" font-size="10" fill="#991b1b" font-style="italic">max cycles</text>

  <!-- Human lane -->
  <rect x="40" y="160" width="300" height="300" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="190" y="184" text-anchor="middle" fill="#6b21a8" font-weight="700">Human (developer)</text>
  <text x="190" y="206" text-anchor="middle" fill="#7c3aed" font-size="11">1. Reads analysis / plan / PR</text>
  <text x="190" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">2. Optionally edits plan/analyze docs</text>
  <text x="190" y="246" text-anchor="middle" fill="#7c3aed" font-size="11">3. Adds comments on ticket or PR</text>
  <text x="190" y="266" text-anchor="middle" fill="#7c3aed" font-size="11">4. Changes ticket status:</text>
  <text x="190" y="286" text-anchor="middle" fill="#16a34a" font-size="11">   • *-approved  → proceed</text>
  <text x="190" y="304" text-anchor="middle" fill="#f97316" font-size="11">   • *-rework    → re-run phases</text>
  <text x="190" y="322" text-anchor="middle" fill="#ef4444" font-size="11">   • failed       → fail run</text>

  <text x="190" y="360" text-anchor="middle" fill="#6b21a8" font-weight="600" font-size="11">webhook → dispatcher</text>
  <text x="190" y="380" text-anchor="middle" fill="#7c3aed" font-size="10">findActiveForTicket(productId, ticketKey)</text>
  <text x="190" y="396" text-anchor="middle" fill="#7c3aed" font-size="10">→ pipeline.resume(sessionId, {status})</text>

  <path d="M 340 300 L 548 225" fill="none" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)" stroke-dasharray="4,3"/>
  <path d="M 340 270 L 548 105" fill="none" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)" stroke-dasharray="4,3"/>
  <path d="M 340 330 L 328 455" fill="none" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)" stroke-dasharray="4,3"/>
  <text x="300" y="435" font-size="10" fill="#f97316" font-style="italic" transform="rotate(-90, 300, 435)">status-change webhook</text>

  <!-- Legend -->
  <rect x="40" y="560" width="920" height="100" rx="6" fill="white" stroke="#e5e7eb"/>
  <text x="60" y="582" font-size="12" font-weight="600" fill="#374151">Legend</text>

  <rect x="60" y="595" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="80" y="607" font-size="11" fill="#555">reviewLoop — blocks until ticket status changes</text>

  <rect x="360" y="595" width="14" height="14" rx="3" fill="#dcfce7" stroke="#166534"/>
  <text x="380" y="607" font-size="11" fill="#555">Automated phase (analyze / plan / implement / git)</text>

  <rect x="60" y="622" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="80" y="634" font-size="11" fill="#555">Human interaction (comments + status changes)</text>

  <line x1="360" y1="629" x2="380" y2="629" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="385" y="634" font-size="11" fill="#555">Rework path (status = *-rework)</text>

  <line x1="560" y1="629" x2="580" y2="629" stroke="#22c55e" stroke-width="1.5"/>
  <text x="585" y="634" font-size="11" fill="#555">Approved path (status = *-approved)</text>
</svg>
