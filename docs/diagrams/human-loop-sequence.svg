<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#475569"/></marker>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#f97316"/></marker>
  </defs>

  <rect width="1100" height="860" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Human Review Loop — Sequence (code-review rework cycle)</text>
  <text x="550" y="52" text-anchor="middle" font-size="11" fill="#64748b">A single rework iteration starting from a blocked code-review step, through re-implementation, back to blocked</text>

  <!-- ─── Lane headers ─────────────────────────────────────────── -->
  <!-- Human -->
  <rect x="22"  y="68" width="112" height="36" rx="8" fill="#5b21b6" filter="url(#sh)"/>
  <text x="78"  y="91" text-anchor="middle" fill="white" font-weight="600" font-size="12">Human</text>

  <!-- GitHub Webhook -->
  <rect x="156" y="68" width="128" height="36" rx="8" fill="#0f172a" filter="url(#sh)"/>
  <text x="220" y="87" text-anchor="middle" fill="white" font-weight="600" font-size="11">GitHub</text>
  <text x="220" y="101" text-anchor="middle" fill="#94a3b8" font-size="9">webhook</text>

  <!-- Dispatcher -->
  <rect x="308" y="68" width="112" height="36" rx="8" fill="#0369a1" filter="url(#sh)"/>
  <text x="364" y="91" text-anchor="middle" fill="white" font-weight="600" font-size="12">Dispatcher</text>

  <!-- Pipeline Runner -->
  <rect x="446" y="68" width="128" height="36" rx="8" fill="#1e40af" filter="url(#sh)"/>
  <text x="510" y="87" text-anchor="middle" fill="white" font-weight="600" font-size="11">Pipeline</text>
  <text x="510" y="101" text-anchor="middle" fill="#bfdbfe" font-size="9">runner</text>

  <!-- reviewLoop phase -->
  <rect x="600" y="68" width="148" height="36" rx="8" fill="#d97706" filter="url(#sh)"/>
  <text x="674" y="87" text-anchor="middle" fill="white" font-weight="600" font-size="11">reviewLoop</text>
  <text x="674" y="101" text-anchor="middle" fill="#fef3c7" font-size="9">phase</text>

  <!-- Providers -->
  <rect x="778" y="68" width="118" height="36" rx="8" fill="#065f46" filter="url(#sh)"/>
  <text x="837" y="91" text-anchor="middle" fill="white" font-weight="600" font-size="12">Providers</text>

  <!-- State Store -->
  <rect x="920" y="68" width="156" height="36" rx="8" fill="#374151" filter="url(#sh)"/>
  <text x="998" y="87" text-anchor="middle" fill="white" font-weight="600" font-size="11">State Store</text>
  <text x="998" y="101" text-anchor="middle" fill="#d1d5db" font-size="9">FileStateStore</text>

  <!-- ─── Lifelines ──────────────────────────────────────────────── -->
  <g stroke="#e2e8f0" stroke-dasharray="4,4" stroke-width="1">
    <line x1="78"  y1="108" x2="78"  y2="810"/>
    <line x1="220" y1="108" x2="220" y2="810"/>
    <line x1="364" y1="108" x2="364" y2="810"/>
    <line x1="510" y1="108" x2="510" y2="810"/>
    <line x1="674" y1="108" x2="674" y2="810"/>
    <line x1="837" y1="108" x2="837" y2="810"/>
    <line x1="998" y1="108" x2="998" y2="810"/>
  </g>

  <!-- ─── Context note ──────────────────────────────────────────── -->
  <rect x="22" y="120" width="400" height="30" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="34" y="140" font-size="10" fill="#78350f" font-style="italic">Run is already blocked at the code-review step — awaiting reviewer action.</text>

  <!-- ─── Messages ─────────────────────────────────────────────── -->

  <!-- ① Human applies "rework-requested" label -->
  <line x1="78" y1="172" x2="213" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="84" y="165" font-size="10" fill="#334155">① apply label "rework-requested" on GitHub issue</text>

  <!-- ② Webhook fires to dispatcher -->
  <line x1="220" y1="210" x2="357" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="226" y="203" font-size="10" fill="#334155">② POST /webhooks/github/:productId</text>
  <text x="226" y="222" font-size="9" fill="#64748b" font-style="italic">eventType="labeled", status="rework-requested"</text>

  <!-- ③ Dispatcher looks up active run in state store -->
  <line x1="364" y1="252" x2="991" y2="252" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="370" y="245" font-size="10" fill="#334155">③ findActiveForTicket(productId, "owner/repo#42")</text>

  <!-- ③ response -->
  <line x1="998" y1="275" x2="371" y2="275" stroke="#475569" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="620" y="270" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">run { sessionId, status: "blocked" }</text>

  <!-- ④ Dispatcher calls pipeline.resume -->
  <line x1="364" y1="310" x2="503" y2="310" stroke="#f97316" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="370" y="303" font-size="10" fill="#c2410c">④ pipeline.resume(sessionId, { ticketStatus: "rework-requested" })</text>

  <!-- ⑤ Runner sets artifact + loads state -->
  <line x1="510" y1="348" x2="991" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="516" y="341" font-size="10" fill="#334155">⑤ load run state · set artifacts.__resumeStatus = "rework-requested"</text>

  <!-- ⑥ Runner re-runs blocked step -->
  <line x1="510" y1="386" x2="666" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="516" y="379" font-size="10" fill="#334155">⑥ re-run blocked step (code-review) with full ctx</text>

  <!-- reviewLoop internal box -->
  <rect x="600" y="400" width="220" height="40" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="710" y="416" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">resolveSemantic(__resumeStatus)</text>
  <text x="710" y="432" text-anchor="middle" font-size="9" fill="#92400e">"rework-requested" → reworkStatus → run onRework</text>

  <!-- ⑦ fetchPRComments -->
  <line x1="674" y1="458" x2="830" y2="458" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="680" y="451" font-size="10" fill="#334155">⑦ git.listPRComments({ prUrl })</text>

  <line x1="837" y1="480" x2="681" y2="480" stroke="#475569" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="760" y="475" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">[{ author, body, path, line }, …]</text>

  <!-- ⑧ re-plan -->
  <line x1="674" y1="516" x2="830" y2="516" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="680" y="509" font-size="10" fill="#334155">⑧ coding.plan({ reviewComments })</text>

  <line x1="837" y1="538" x2="681" y2="538" stroke="#475569" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="756" y="533" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">new plan artifact</text>

  <!-- ⑨ re-implement -->
  <line x1="674" y1="574" x2="830" y2="574" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="680" y="567" font-size="10" fill="#334155">⑨ coding.implement({ reviewComments })</text>

  <line x1="837" y1="596" x2="681" y2="596" stroke="#475569" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#a)"/>
  <text x="756" y="591" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">implementation artifact</text>

  <!-- ⑩ commitPush -->
  <line x1="674" y1="632" x2="830" y2="632" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="680" y="625" font-size="10" fill="#334155">⑩ coding.commitPushRepos()  → commit artifact</text>

  <!-- ⑪ reviewLoop returns blocked again -->
  <line x1="666" y1="668" x2="517" y2="668" stroke="#f97316" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="586" y="661" text-anchor="middle" font-size="10" fill="#c2410c">⑪ return blocked(cycles += 1, "awaiting next review")</text>

  <!-- ⑫ Runner persists state -->
  <line x1="510" y1="704" x2="991" y2="704" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="516" y="697" font-size="10" fill="#334155">⑫ save run (status=blocked · artifacts merged · cycles incremented)</text>

  <!-- ⑬ Next cycle note -->
  <line x1="78" y1="762" x2="213" y2="762" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>
  <text x="84" y="755" font-size="10" fill="#065f46">⑬ next iteration: human labels "completed"</text>
  <text x="84" y="778" font-size="9" fill="#64748b" font-style="italic">→ resume → reviewLoop returns ok() → pipeline continues to next step</text>
</svg>
