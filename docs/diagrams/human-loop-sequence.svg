<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="system-ui, -apple-system, sans-serif" font-size="11">
  <defs>
    <marker id="s-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="s-arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="s-arr-o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="1100" height="820" fill="#fafafa" rx="8"/>
  <text x="550" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Human Review Loop — Sequence (code-review rework cycle)</text>

  <!-- Lanes -->
  <g font-size="12" font-weight="600" fill="white">
    <rect x="60"   y="60" width="120" height="30" rx="6" fill="#6b21a8"/><text x="120"  y="80" text-anchor="middle">Human</text>
    <rect x="210"  y="60" width="120" height="30" rx="6" fill="#2563eb"/><text x="270"  y="80" text-anchor="middle">GitHub Webhook</text>
    <rect x="360"  y="60" width="120" height="30" rx="6" fill="#0369a1"/><text x="420"  y="80" text-anchor="middle">Dispatcher</text>
    <rect x="510"  y="60" width="120" height="30" rx="6" fill="#1e40af"/><text x="570"  y="80" text-anchor="middle">Pipeline Runner</text>
    <rect x="660"  y="60" width="150" height="30" rx="6" fill="#d97706"/><text x="735"  y="80" text-anchor="middle">reviewLoop phase</text>
    <rect x="840"  y="60" width="100" height="30" rx="6" fill="#166534"/><text x="890"  y="80" text-anchor="middle">Providers</text>
    <rect x="970"  y="60" width="100" height="30" rx="6" fill="#7c3aed"/><text x="1020" y="80" text-anchor="middle">State Store</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#cbd5e1" stroke-dasharray="3,3">
    <line x1="120"  y1="95" x2="120"  y2="780"/>
    <line x1="270"  y1="95" x2="270"  y2="780"/>
    <line x1="420"  y1="95" x2="420"  y2="780"/>
    <line x1="570"  y1="95" x2="570"  y2="780"/>
    <line x1="735"  y1="95" x2="735"  y2="780"/>
    <line x1="890"  y1="95" x2="890"  y2="780"/>
    <line x1="1020" y1="95" x2="1020" y2="780"/>
  </g>

  <!-- Step 0: initial block (context) -->
  <text x="60" y="118" fill="#64748b" font-style="italic">run is already blocked at code-review step from earlier — awaiting review</text>

  <!-- Step 1: human applies "rework-requested" label -->
  <g>
    <line x1="120" y1="150" x2="265" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="125" y="145" font-size="10" fill="#334155">① apply label "rework-requested"</text>
  </g>

  <!-- Step 2: webhook fires -->
  <g>
    <line x1="270" y1="180" x2="417" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="275" y="175" font-size="10" fill="#334155">② POST /webhooks/github/:productId (labeled event)</text>
    <text x="275" y="194" font-size="9"  fill="#64748b" font-style="italic">eventType="status-change", newStatus="rework-requested"</text>
  </g>

  <!-- Step 3: dispatcher looks up run -->
  <g>
    <line x1="420" y1="225" x2="1017" y2="225" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="425" y="220" font-size="10" fill="#334155">③ findActiveForTicket(productId, "owner/repo#42")</text>
  </g>
  <g>
    <line x1="1020" y1="250" x2="423" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="850" y="245" font-size="10" fill="#334155">run { sessionId, status: "blocked" }</text>
  </g>

  <!-- Step 4: resume -->
  <g>
    <line x1="420" y1="285" x2="567" y2="285" stroke="#f97316" stroke-width="1.5" marker-end="url(#s-arr-o)"/>
    <text x="425" y="280" font-size="10" fill="#9a3412">④ pipeline.resume(sessionId, {ticketStatus: "rework-requested"})</text>
  </g>

  <!-- Step 5: runner sets artifact -->
  <g>
    <line x1="570" y1="315" x2="1017" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="575" y="310" font-size="10" fill="#334155">⑤ load run + set artifacts.__resumeStatus="rework-requested"</text>
  </g>

  <!-- Step 6: runner re-runs blocked step -->
  <g>
    <line x1="570" y1="350" x2="732" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="575" y="345" font-size="10" fill="#334155">⑥ re-run blocked step (code-review) with ctx</text>
  </g>

  <!-- Step 7: reviewLoop checks status, runs onRework -->
  <rect x="660" y="370" width="160" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="740" y="383" text-anchor="middle" font-size="10" fill="#92400e">resolveSemantic</text>
  <text x="740" y="396" text-anchor="middle" font-size="9" fill="#92400e">"rework-requested" → reworkStatus</text>

  <!-- Step 8: fetchPRComments -->
  <g>
    <line x1="735" y1="430" x2="887" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="740" y="425" font-size="10" fill="#334155">⑦ git.listPRComments({prUrl})</text>
  </g>
  <g>
    <line x1="890" y1="455" x2="738" y2="455" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="750" y="450" font-size="10" fill="#334155">[{author, body, path, line}, ...]</text>
  </g>

  <!-- Step 9: re-plan -->
  <g>
    <line x1="735" y1="490" x2="887" y2="490" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="740" y="485" font-size="10" fill="#334155">⑧ coding.plan({reviewComments})</text>
  </g>
  <g>
    <line x1="890" y1="515" x2="738" y2="515" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="760" y="510" font-size="10" fill="#334155">new plan</text>
  </g>

  <!-- Step 10: re-implement -->
  <g>
    <line x1="735" y1="545" x2="887" y2="545" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="740" y="540" font-size="10" fill="#334155">⑨ coding.implement({reviewComments})</text>
  </g>
  <g>
    <line x1="890" y1="570" x2="738" y2="570" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="762" y="565" font-size="10" fill="#334155">code changed</text>
  </g>

  <!-- Step 11: commitPush -->
  <g>
    <line x1="735" y1="600" x2="887" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="740" y="595" font-size="10" fill="#334155">⑩ coding.commitPushRepos()</text>
  </g>

  <!-- Step 12: reviewLoop returns blocked again -->
  <g>
    <line x1="732" y1="640" x2="573" y2="640" stroke="#f97316" stroke-width="1.5" marker-end="url(#s-arr-o)"/>
    <text x="580" y="635" font-size="10" fill="#9a3412">⑪ return blocked(cycles=1, "awaiting next review")</text>
  </g>

  <!-- Step 13: runner persists -->
  <g>
    <line x1="570" y1="670" x2="1017" y2="670" stroke="#475569" stroke-width="1.5" marker-end="url(#s-arr)"/>
    <text x="575" y="665" font-size="10" fill="#334155">⑫ save run (status=blocked, artifacts merged, cycles+=1)</text>
  </g>

  <!-- Step 14: notify human (optional Slack side-channel not shown) -->
  <g>
    <line x1="565" y1="700" x2="125" y2="700" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#s-arr)"/>
    <text x="200" y="695" font-size="10" fill="#334155" font-style="italic">(optional notify phase — side-effect of next step on next resume)</text>
  </g>

  <!-- Step 15: next cycle — human labels "completed" -->
  <g>
    <line x1="120" y1="745" x2="265" y2="745" stroke="#16a34a" stroke-width="1.5" marker-end="url(#s-arr-g)"/>
    <text x="125" y="740" font-size="10" fill="#166534">⑬ next iteration: label "completed" → resume → reviewLoop.ok() → pipeline continues</text>
  </g>
</svg>
