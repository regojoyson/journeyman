<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6A1B9A"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="880" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Journeyman — Docker Compose Deployment</text>

  <!-- browser -->
  <rect x="110" y="48" width="160" height="46" rx="10" fill="#FAFAFA" stroke="#424242" stroke-width="1.5"/>
  <text x="190" y="77" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Browser (user)</text>

  <!-- compose boundary -->
  <rect x="30" y="112" width="1120" height="738" rx="14" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="48" y="135" font-size="13" font-weight="600" fill="#757575">docker compose — one private bridge network · services reach each other by name · outbound internet enabled</text>

  <!-- web -->
  <rect x="90" y="150" width="200" height="64" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
  <text x="190" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">web (nginx)</text>
  <text x="190" y="197" text-anchor="middle" font-size="11.5" fill="#555">:6080 · SPA + /api proxy</text>

  <!-- api-server -->
  <rect x="90" y="280" width="200" height="64" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.6"/>
  <text x="190" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#0d47a1">api-server</text>
  <text x="190" y="327" text-anchor="middle" font-size="11.5" fill="#555">:6000 · REST + SSE</text>

  <!-- postgres -->
  <rect x="90" y="410" width="200" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
  <text x="190" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">postgres</text>
  <text x="190" y="457" text-anchor="middle" font-size="11.5" fill="#555">:6032 · persistence</text>

  <!-- worker -->
  <rect x="90" y="560" width="200" height="64" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1.6"/>
  <text x="190" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#bf360c">worker</text>
  <text x="190" y="607" text-anchor="middle" font-size="11.5" fill="#555">runs each flow step</text>

  <!-- conductor -->
  <rect x="420" y="280" width="200" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
  <text x="520" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">conductor</text>
  <text x="520" y="327" text-anchor="middle" font-size="11.5" fill="#555">:6008 · UI :6005 · durable engine</text>

  <!-- redis -->
  <rect x="720" y="280" width="180" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
  <text x="810" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#1b5e20">redis</text>
  <text x="810" y="327" text-anchor="middle" font-size="11.5" fill="#555">:6079 · queue</text>

  <!-- migrations -->
  <rect x="420" y="400" width="200" height="60" rx="10" fill="#ECEFF1" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="520" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#37474f">migrations</text>
  <text x="520" y="444" text-anchor="middle" font-size="11" fill="#555">one-shot: migrate, then exit</text>

  <!-- dind -->
  <rect x="420" y="530" width="380" height="200" rx="12" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.8"/>
  <text x="438" y="558" font-size="15" font-weight="600" fill="#4a148c">docker (dind)</text>
  <text x="438" y="577" font-size="11.5" fill="#555">:2375 · built-in Docker engine (privileged)</text>
  <text x="438" y="596" font-size="11.5" fill="#555">creates / destroys isolated job containers</text>
  <rect x="438" y="630" width="96" height="64" rx="8" fill="#ffffff" stroke="#9C27B0" stroke-width="1.4"/>
  <text x="486" y="666" text-anchor="middle" font-size="12" fill="#6a1b9a">job</text>
  <rect x="548" y="630" width="96" height="64" rx="8" fill="#ffffff" stroke="#9C27B0" stroke-width="1.4"/>
  <text x="596" y="666" text-anchor="middle" font-size="12" fill="#6a1b9a">job</text>
  <rect x="658" y="630" width="120" height="64" rx="8" fill="#ffffff" stroke="#9C27B0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="718" y="666" text-anchor="middle" font-size="12" fill="#6a1b9a">job…</text>

  <!-- host folder -->
  <rect x="90" y="690" width="300" height="120" rx="10" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.6"/>
  <text x="104" y="718" font-size="14" font-weight="600" fill="#7a5c00">/data/journeyman</text>
  <text x="104" y="736" font-size="11" fill="#7a5c00">(host bind-mount)</text>
  <text x="104" y="760" font-size="11.5" fill="#555">workspaces/ — local-sandbox runs</text>
  <text x="104" y="779" font-size="11.5" fill="#555">kit/ — runner tars</text>
  <text x="104" y="797" font-size="11.5" fill="#555">      (loaded into dind by worker)</text>

  <!-- build:kit (host shell) -->
  <rect x="430" y="752" width="300" height="56" rx="10" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="580" y="775" text-anchor="middle" font-size="13" font-weight="600" fill="#7a5c00">npm run build:kit  (run on host)</text>
  <text x="580" y="793" text-anchor="middle" font-size="11" fill="#7a5c00">builds runner-base.tar + runner-bundle.tar</text>

  <!-- legend -->
  <rect x="840" y="530" width="300" height="200" rx="10" fill="#FAFAFA" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="856" y="556" font-size="13" font-weight="700" fill="#444">Volumes</text>
  <text x="856" y="577" font-size="11" fill="#555">named: pgdata · redisdata · dind-storage</text>
  <text x="856" y="595" font-size="11" fill="#555">bind: ${JOURNEYMAN_BASE_DIR}</text>
  <text x="856" y="612" font-size="11" fill="#555">      → /data/journeyman</text>
  <text x="856" y="640" font-size="13" font-weight="700" fill="#444">Secrets (.env)</text>
  <text x="856" y="661" font-size="11" fill="#555">JWT_SECRET</text>
  <text x="856" y="678" font-size="11" fill="#555">JM_SECRET_ENCRYPTION_KEY</text>
  <text x="856" y="695" font-size="11" fill="#555">ANTHROPIC_API_KEY</text>
  <text x="856" y="718" font-size="11" fill="#555">worker DOCKER_HOST=tcp://docker:2375</text>

  <!-- ARROWS (orthogonal) -->
  <!-- browser -> web -->
  <line x1="190" y1="94" x2="190" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- web -> api -->
  <line x1="190" y1="214" x2="190" y2="280" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="200" y="252" font-size="11" fill="#444">/api → :4000</text>
  <!-- api -> postgres -->
  <line x1="190" y1="344" x2="190" y2="410" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="200" y="382" font-size="11" fill="#444">SQL</text>
  <!-- worker -> postgres -->
  <line x1="190" y1="560" x2="190" y2="474" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="200" y="520" font-size="11" fill="#444">SQL</text>
  <!-- api -> conductor -->
  <line x1="290" y1="300" x2="420" y2="300" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="292" font-size="11" fill="#444">start workflow</text>
  <!-- conductor -> redis -->
  <line x1="620" y1="312" x2="720" y2="312" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="630" y="304" font-size="11" fill="#444">queue</text>
  <!-- worker -> conductor (poll) elbow -->
  <polyline points="290,580 360,580 360,326 420,326" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="366" y="470" font-size="11" fill="#444">poll tasks</text>
  <!-- migrations -> postgres -->
  <line x1="420" y1="430" x2="292" y2="430" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="318" y="422" font-size="10.5" fill="#546E7A">migrate</text>
  <!-- worker -> dind (docker workspace) -->
  <line x1="290" y1="606" x2="420" y2="606" stroke="#6A1B9A" stroke-width="1.9" marker-end="url(#arrowP)"/>
  <text x="296" y="599" font-size="11" font-weight="600" fill="#4a148c">docker workspace · load kit + run job</text>
  <!-- worker -> host folder (local workspace) -->
  <line x1="190" y1="624" x2="190" y2="690" stroke="#E65100" stroke-width="1.9" marker-end="url(#arrowO)"/>
  <text x="200" y="662" font-size="11" font-weight="600" fill="#bf360c">local workspace</text>
  <!-- build:kit -> host folder (kit) -->
  <line x1="430" y1="780" x2="392" y2="780" stroke="#F57F17" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
</svg>
