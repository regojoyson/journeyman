<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#94a3b8"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Adapter Pattern</text>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#64748b">One interface in core · many implementations in packages · pick one per YAML line</text>

  <!-- ─── Top: YAML line ─────────────────────────────────────── -->
  <rect x="380" y="96" width="240" height="44" rx="8" fill="#0f172a" filter="url(#sh)"/>
  <text x="500" y="114" text-anchor="middle" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="11" fill="#94a3b8">flow.yaml</text>
  <text x="500" y="131" text-anchor="middle" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="12" fill="#a5f3fc">coding: claude</text>

  <line x1="500" y1="140" x2="500" y2="172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Interface (center) ─────────────────────────────────── -->
  <rect x="320" y="178" width="360" height="78" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="320" y="178" width="4" height="78" rx="2" fill="#0891b2"/>
  <text x="500" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ICodingCLI</text>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#64748b">interface · @journeyman/core</text>
  <text x="500" y="242" text-anchor="middle" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="10" fill="#334155">analyze() · plan() · implement() · …</text>

  <!-- "implements" label and arrows -->
  <text x="500" y="280" text-anchor="middle" font-size="10" font-style="italic" fill="#94a3b8">implements ↑</text>

  <line x1="140" y1="340" x2="440" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="310" y1="340" x2="460" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="340" x2="500" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="690" y1="340" x2="540" y2="262" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="860" y1="340" x2="560" y2="262" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ─── Implementations row ────────────────────────────────── -->
  <g font-size="11">
    <!-- Claude (active) -->
    <rect x="80" y="340" width="120" height="58" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="80" y="340" width="120" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="140" y="366" text-anchor="middle" font-weight="700" fill="#0f172a">Claude</text>
    <text x="140" y="384" text-anchor="middle" font-size="9" fill="#94a3b8">id: "claude"</text>

    <!-- OpenCode -->
    <rect x="250" y="340" width="120" height="58" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="250" y="340" width="120" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="310" y="366" text-anchor="middle" font-weight="700" fill="#0f172a">OpenCode</text>
    <text x="310" y="384" text-anchor="middle" font-size="9" fill="#94a3b8">id: "opencode"</text>

    <!-- Gemini -->
    <rect x="420" y="340" width="120" height="58" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="420" y="340" width="120" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="480" y="366" text-anchor="middle" font-weight="700" fill="#0f172a">Gemini</text>
    <text x="480" y="384" text-anchor="middle" font-size="9" fill="#94a3b8">id: "gemini"</text>

    <!-- Codex -->
    <rect x="590" y="340" width="120" height="58" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="590" y="340" width="120" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="650" y="366" text-anchor="middle" font-weight="700" fill="#0f172a">Codex</text>
    <text x="650" y="384" text-anchor="middle" font-size="9" fill="#94a3b8">id: "codex"</text>

    <!-- Custom extensibility slot -->
    <rect x="760" y="340" width="160" height="58" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="800" y="376" font-size="22" font-weight="300" fill="#94a3b8">+</text>
    <text x="860" y="368" font-size="11" font-weight="600" fill="#64748b">Your Provider</text>
    <text x="860" y="384" font-size="9" fill="#94a3b8">id: "anything"</text>
  </g>

  <!-- "Pipeline selects one by id" arrow back to interface -->
  <line x1="140" y1="340" x2="140" y2="440" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 140 440 Q 140 452 152 452 L 380 452" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="270" y="446" text-anchor="middle" font-size="10" fill="#7c3aed" font-style="italic">selected by id</text>

  <!-- Call site -->
  <rect x="380" y="434" width="240" height="44" rx="8" fill="#0f172a" filter="url(#sh)"/>
  <text x="500" y="452" text-anchor="middle" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="11" fill="#94a3b8">phase code</text>
  <text x="500" y="469" text-anchor="middle" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="12" fill="#a5f3fc">ctx.providers.coding.analyze(…)</text>

  <!-- ─── Bottom: four categories summary ─────────────────────── -->
  <text x="500" y="512" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">SAME PATTERN ACROSS ALL FOUR CATEGORIES</text>

  <g font-size="11">
    <!-- Coding -->
    <rect x="60" y="530" width="210" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="165" y="552" text-anchor="middle" font-weight="700" fill="#0f172a">Coding</text>
    <text x="165" y="570" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">ICodingCLI</text>
    <text x="165" y="584" text-anchor="middle" font-size="9" fill="#94a3b8">Claude · OpenCode · …</text>

    <!-- Git -->
    <rect x="280" y="530" width="210" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="385" y="552" text-anchor="middle" font-weight="700" fill="#0f172a">Git</text>
    <text x="385" y="570" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">IGitProvider</text>
    <text x="385" y="584" text-anchor="middle" font-size="9" fill="#94a3b8">GitHub · GitLab</text>

    <!-- Ticket -->
    <rect x="500" y="530" width="210" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="605" y="552" text-anchor="middle" font-weight="700" fill="#0f172a">Ticket</text>
    <text x="605" y="570" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">ITicketProvider</text>
    <text x="605" y="584" text-anchor="middle" font-size="9" fill="#94a3b8">GitHub · Jira · Linear · …</text>

    <!-- Notification -->
    <rect x="720" y="530" width="220" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="830" y="552" text-anchor="middle" font-weight="700" fill="#0f172a">Notification</text>
    <text x="830" y="570" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">INotificationProvider</text>
    <text x="830" y="584" text-anchor="middle" font-size="9" fill="#94a3b8">Console · Slack · …</text>
  </g>
</svg>
