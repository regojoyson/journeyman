<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Adapter Pattern</text>
  <text x="500" y="70" text-anchor="middle" font-size="12" fill="#64748b">Four interfaces · many implementations · pick one per YAML line</text>

  <!-- Four columns -->

  <!-- Coding -->
  <g>
    <rect x="60" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#sh)"/>
    <text x="160" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ICodingCLI</text>
    <text x="160" y="156" text-anchor="middle" font-size="10" fill="#64748b">Coding</text>

    <line x1="160" y1="176" x2="160" y2="190" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="90" y="196" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="160" y="219" text-anchor="middle" font-size="12" fill="#0f172a">Claude</text>

    <rect x="90" y="240" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="160" y="263" text-anchor="middle" font-size="12" fill="#0f172a">OpenCode</text>

    <rect x="90" y="284" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="160" y="307" text-anchor="middle" font-size="12" fill="#94a3b8">Gemini</text>

    <rect x="90" y="328" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="160" y="351" text-anchor="middle" font-size="12" fill="#94a3b8">Codex</text>

    <rect x="90" y="372" width="140" height="36" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="160" y="395" text-anchor="middle" font-size="16" font-weight="300" fill="#94a3b8">+</text>
  </g>

  <!-- Git -->
  <g>
    <rect x="300" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#sh)"/>
    <text x="400" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IGitProvider</text>
    <text x="400" y="156" text-anchor="middle" font-size="10" fill="#64748b">Git</text>

    <line x1="400" y1="176" x2="400" y2="190" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="330" y="196" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="400" y="219" text-anchor="middle" font-size="12" fill="#0f172a">GitHub</text>

    <rect x="330" y="240" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="400" y="263" text-anchor="middle" font-size="12" fill="#94a3b8">GitLab</text>

    <rect x="330" y="372" width="140" height="36" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="400" y="395" text-anchor="middle" font-size="16" font-weight="300" fill="#94a3b8">+</text>
  </g>

  <!-- Ticket -->
  <g>
    <rect x="540" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#sh)"/>
    <text x="640" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ITicketProvider</text>
    <text x="640" y="156" text-anchor="middle" font-size="10" fill="#64748b">Ticket</text>

    <line x1="640" y1="176" x2="640" y2="190" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="570" y="196" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="640" y="219" text-anchor="middle" font-size="12" fill="#0f172a">GitHub Issues</text>

    <rect x="570" y="240" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="640" y="263" text-anchor="middle" font-size="12" fill="#0f172a">GitHub Projects</text>

    <rect x="570" y="284" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="640" y="307" text-anchor="middle" font-size="12" fill="#94a3b8">Jira</text>

    <rect x="570" y="328" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="640" y="351" text-anchor="middle" font-size="12" fill="#94a3b8">Linear · Monday</text>

    <rect x="570" y="372" width="140" height="36" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="640" y="395" text-anchor="middle" font-size="16" font-weight="300" fill="#94a3b8">+</text>
  </g>

  <!-- Notification -->
  <g>
    <rect x="780" y="112" width="200" height="56" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5" filter="url(#sh)"/>
    <text x="880" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">INotificationProvider</text>
    <text x="880" y="154" text-anchor="middle" font-size="10" fill="#64748b">Notification</text>

    <line x1="880" y1="176" x2="880" y2="190" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="810" y="196" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="880" y="219" text-anchor="middle" font-size="12" fill="#0f172a">Console</text>

    <rect x="810" y="240" width="140" height="36" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="880" y="263" text-anchor="middle" font-size="12" fill="#94a3b8">Slack</text>

    <rect x="810" y="372" width="140" height="36" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="880" y="395" text-anchor="middle" font-size="16" font-weight="300" fill="#94a3b8">+</text>
  </g>

  <!-- Footer -->
  <text x="500" y="444" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">implemented · planned / stub · add your own</text>
</svg>
