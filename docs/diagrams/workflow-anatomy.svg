<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <style>
      .box { rx:10; ry:10; stroke-width:2; }
      .t { font-size:14px; font-weight:700; }
      .s { font-size:11.5px; fill:#334155; }
      .l { font-size:11px; fill:#64748b; }
      .e { stroke:#475569; stroke-width:2; fill:none; }
      .code { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
    </style>
  </defs>
  <rect width="1200" height="1080" fill="#f8fafc"/>
  <text x="40" y="44" font-size="26" font-weight="800" fill="#0f172a">A Workflow: what you draw vs. what runs</text>
  <text x="40" y="70" font-size="14" fill="#64748b">You build a flow on the canvas (nodes + edges). The converter turns it into a task list Conductor executes.</text>

  <!-- LEFT: canvas -->
  <rect x="40" y="96" width="560" height="690" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="40" y="96" width="560" height="38" rx="16" fill="#7c3aed"/>
  <text x="62" y="121" font-size="15" font-weight="800" fill="#fff">What you draw — the visual canvas</text>

  <!-- trigger -->
  <rect class="box" x="220" y="156" width="200" height="56" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="320" y="180" class="t" fill="#5b21b6" text-anchor="middle">▶ Trigger</text>
  <text x="320" y="199" class="s" text-anchor="middle">ticket / webhook / manual</text>

  <!-- step -->
  <rect class="box" x="220" y="240" width="200" height="56" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="320" y="264" class="t" fill="#075985" text-anchor="middle">Step node</text>
  <text x="320" y="283" class="s" text-anchor="middle">e.g. analyze ticket</text>

  <!-- if / switch -->
  <path d="M320,324 L380,360 L320,396 L260,360 Z" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="320" y="365" class="t" fill="#115e59" text-anchor="middle">If?</text>

  <!-- branch A -->
  <rect class="box" x="96" y="430" width="180" height="52" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="186" y="461" class="s" fill="#075985" text-anchor="middle">branch A · small fix</text>
  <!-- branch B -->
  <rect class="box" x="364" y="430" width="180" height="52" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="454" y="461" class="s" fill="#075985" text-anchor="middle">branch B · big change</text>

  <!-- human pause -->
  <rect class="box" x="364" y="510" width="180" height="56" fill="#eff6ff" stroke="#2563eb"/>
  <text x="454" y="534" class="t" fill="#1e40af" text-anchor="middle">⏸ Human Task</text>
  <text x="454" y="553" class="s" text-anchor="middle">approve before coding</text>

  <!-- fork -->
  <path d="M320,596 L356,620 L320,644 L284,620 Z" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="320" y="625" class="l" fill="#115e59" text-anchor="middle">Fork</text>
  <rect class="box" x="150" y="666" width="150" height="44" fill="#dcfce7" stroke="#16a34a"/>
  <text x="225" y="693" class="s" fill="#166534" text-anchor="middle">implement</text>
  <rect class="box" x="340" y="666" width="150" height="44" fill="#dcfce7" stroke="#16a34a"/>
  <text x="415" y="693" class="s" fill="#166534" text-anchor="middle">run tests</text>

  <!-- end -->
  <rect class="box" x="240" y="730" width="160" height="44" fill="#fee2e2" stroke="#dc2626"/>
  <text x="320" y="757" class="t" fill="#991b1b" text-anchor="middle">■ End</text>

  <!-- canvas edges -->
  <path class="e" d="M320,212 L320,240" marker-end="url(#a)"/>
  <path class="e" d="M320,296 L320,324" marker-end="url(#a)"/>
  <path class="e" d="M280,376 L210,430" marker-end="url(#a)"/>
  <text x="222" y="412" class="l">yes</text>
  <path class="e" d="M360,376 L440,430" marker-end="url(#a)"/>
  <text x="408" y="412" class="l">no</text>
  <path class="e" d="M454,482 L454,510" marker-end="url(#a)"/>
  <path class="e" d="M186,482 C186,560 320,560 308,598" marker-end="url(#a)"/>
  <path class="e" d="M454,566 C454,585 360,590 332,602" marker-end="url(#a)"/>
  <path class="e" d="M300,640 L235,666" marker-end="url(#a)"/>
  <path class="e" d="M340,640 L405,666" marker-end="url(#a)"/>
  <path class="e" d="M225,710 C225,724 300,730 300,742" marker-end="url(#a)"/>
  <path class="e" d="M415,710 C415,724 345,730 345,742" marker-end="url(#a)"/>

  <!-- conversion arrow -->
  <path d="M610,440 L660,440" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <text x="635" y="425" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">convert</text>
  <text x="635" y="470" class="l" text-anchor="middle">conductor-</text>
  <text x="635" y="485" class="l" text-anchor="middle">converter.ts</text>

  <!-- RIGHT: conductor task list -->
  <rect x="672" y="96" width="488" height="690" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="672" y="96" width="488" height="38" rx="16" fill="#d97706"/>
  <text x="694" y="121" font-size="15" font-weight="800" fill="#fff">What runs — Conductor task list</text>
  <text x="694" y="160" class="l">Each drawn node becomes a typed engine task:</text>

  <g class="code">
    <rect class="box" x="694" y="176" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="201" fill="#92400e">SIMPLE</text>
    <text x="900" y="201" class="l">→ a step a worker runs</text>

    <rect class="box" x="694" y="224" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="249" fill="#92400e">SWITCH</text>
    <text x="900" y="249" class="l">→ the If / branch decision</text>

    <rect class="box" x="694" y="272" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="297" fill="#92400e">HUMAN</text>
    <text x="900" y="297" class="l">→ pause for a person / webhook</text>

    <rect class="box" x="694" y="320" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="345" fill="#92400e">FORK_JOIN + JOIN</text>
    <text x="965" y="345" class="l">→ run branches in parallel</text>

    <rect class="box" x="694" y="368" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="393" fill="#92400e">DO_WHILE</text>
    <text x="900" y="393" class="l">→ a loop body</text>

    <rect class="box" x="694" y="416" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="441" fill="#92400e">WAIT</text>
    <text x="900" y="441" class="l">→ a timer</text>

    <rect class="box" x="694" y="464" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="489" fill="#92400e">SUB_WORKFLOW</text>
    <text x="965" y="489" class="l">→ a nested flow</text>

    <rect class="box" x="694" y="512" width="444" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="710" y="537" fill="#92400e">TERMINATE</text>
    <text x="900" y="537" class="l">→ the End node</text>
  </g>

  <text x="694" y="588" class="l">Before converting, the flow is validated:</text>
  <text x="710" y="610" class="s">✓ exactly one start, at least one end</text>
  <text x="710" y="630" class="s">✓ no step reads data from a branch it can't see</text>
  <text x="710" y="650" class="s">✓ fork/join structure is balanced</text>
  <text x="710" y="670" class="s">✓ input shapes line up between connected nodes</text>
  <text x="694" y="700" class="l">Inputs like `analyze.output.summary` are rewritten to</text>
  <text x="694" y="718" class="l">Conductor refs `${analyze.output.summary}` so the engine</text>
  <text x="694" y="736" class="l">wires each step's output into the next step's input.</text>
  <text x="694" y="762" class="l">resolve-inputs.ts</text>

  <!-- footer -->
  <rect x="40" y="812" width="1120" height="232" rx="14" fill="#0f172a"/>
  <text x="64" y="848" font-size="17" font-weight="800" fill="#f8fafc">The key idea</text>
  <text x="64" y="880" font-size="14" fill="#e2e8f0">A workflow is just a graph: boxes (nodes) connected by arrows (edges). Nodes are either steps (real work) or</text>
  <text x="64" y="904" font-size="14" fill="#e2e8f0">control-flow (branch, loop, fork/join, pause, end). Edges carry data and conditions between them.</text>
  <text x="64" y="936" font-size="14" fill="#7dd3fc">You author it in the editor → it's validated → converted to a Conductor task list → Conductor runs it durably.</text>
  <text x="64" y="968" font-size="14" fill="#e2e8f0">The same JSON is used in the editor and at runtime — what you draw is exactly what executes.</text>
  <text x="64" y="1004" font-size="13" fill="#94a3b8">Files: flow-json/conductor-converter.ts (convert + validate) · flow-json/resolve-inputs.ts (wire inputs) · flow-json/conductor-types.ts (task shapes)</text>
</svg>
