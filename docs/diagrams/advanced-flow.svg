<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#94a3b8"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Flow: advanced-flow</text>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#64748b">Six stages · two human review gates · auto-progresses between them</text>

  <!-- Providers strip -->
  <rect x="240" y="84" width="520" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="103" text-anchor="middle" font-size="10" fill="#475569">
    <tspan fill="#94a3b8">providers · </tspan>
    <tspan font-weight="600" fill="#334155">ticket:</tspan> github-issues
    <tspan font-weight="600" fill="#334155">  git:</tspan> github
    <tspan font-weight="600" fill="#334155">  coding:</tspan> claude
    <tspan font-weight="600" fill="#334155">  notification:</tspan> console
  </text>

  <!-- ─── Stage 1: Setup ─────────────────────────────────────── -->
  <rect x="80" y="134" width="840" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="80" y="134" width="4" height="60" rx="2" fill="#2563eb"/>
  <text x="100" y="156" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">SETUP</text>
  <text x="100" y="180" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">fetchTicket</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">cloneRepos</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">updateStatus</tspan>
    <tspan fill="#64748b"> (development-started)</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">checkoutRepo</tspan>
  </text>

  <line x1="500" y1="194" x2="500" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Stage 2: Analyze ───────────────────────────────────── -->
  <rect x="80" y="216" width="840" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="80" y="216" width="4" height="60" rx="2" fill="#7c3aed"/>
  <text x="100" y="238" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">ANALYZE</text>
  <text x="100" y="262" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">analyze</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">addComment</tspan>
    <tspan fill="#64748b"> (analysis-summary)</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">notify</tspan>
  </text>

  <line x1="500" y1="276" x2="500" y2="294" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Stage 3: Plan ──────────────────────────────────────── -->
  <rect x="80" y="298" width="840" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="80" y="298" width="4" height="60" rx="2" fill="#7c3aed"/>
  <text x="100" y="320" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">PLAN</text>
  <text x="100" y="344" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">plan</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">commitPushRepos</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">createPR</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">addComment</tspan>
    <tspan fill="#64748b"> (plan-summary)</tspan>
  </text>

  <line x1="500" y1="358" x2="500" y2="376" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Gate 1: plan-review ────────────────────────────────── -->
  <rect x="80" y="380" width="840" height="72" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="100" y="402" font-size="10" font-weight="600" fill="#b45309" letter-spacing="2">⏸  HUMAN GATE</text>
  <text x="100" y="426" font-size="11" fill="#78350f">
    <tspan font-weight="700">reviewLoop</tspan>
    <tspan> · awaits ticket status change</tspan>
  </text>
  <text x="100" y="443" font-size="10" fill="#92400e">
    <tspan fill="#059669" font-weight="600">plan-approved</tspan>
    <tspan> → proceed   ·   </tspan>
    <tspan fill="#f97316" font-weight="600">plan-rework-requested</tspan>
    <tspan> → onRework: [fetchPRComments, plan, commitPushRepos]   ·   maxCycles: 3</tspan>
  </text>

  <line x1="500" y1="452" x2="500" y2="470" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Stage 4: Implement ─────────────────────────────────── -->
  <rect x="80" y="474" width="840" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="80" y="474" width="4" height="60" rx="2" fill="#059669"/>
  <text x="100" y="496" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">IMPLEMENT</text>
  <text x="100" y="520" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">notify</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">implement</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">commitPushRepos</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">addComment</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">notify</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">updateStatus</tspan>
    <tspan fill="#64748b"> (code-review)</tspan>
  </text>

  <line x1="500" y1="534" x2="500" y2="552" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Gate 2: code-review ────────────────────────────────── -->
  <rect x="80" y="556" width="840" height="72" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="100" y="578" font-size="10" font-weight="600" fill="#b45309" letter-spacing="2">⏸  HUMAN GATE</text>
  <text x="100" y="602" font-size="11" fill="#78350f">
    <tspan font-weight="700">reviewLoop</tspan>
    <tspan> · awaits PR review</tspan>
  </text>
  <text x="100" y="619" font-size="10" font-weight="400" fill="#92400e">
    <tspan fill="#059669" font-weight="600">completed</tspan>
    <tspan> → done   ·   </tspan>
    <tspan fill="#f97316" font-weight="600">rework-requested</tspan>
    <tspan> → onRework: [fetchPRComments, plan, implement, commitPushRepos]   ·   maxCycles: 3</tspan>
  </text>

  <line x1="500" y1="628" x2="500" y2="646" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Stage 5: Finish ────────────────────────────────────── -->
  <rect x="80" y="650" width="840" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="80" y="650" width="4" height="60" rx="2" fill="#475569"/>
  <text x="100" y="672" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">FINISH</text>
  <text x="100" y="696" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">notify</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">addComment</tspan>
    <tspan fill="#64748b"> (completion-summary)</tspan>
    <tspan fill="#94a3b8"> → </tspan>
    <tspan font-weight="600" fill="#0f172a">cleanupRepos</tspan>
  </text>

  <!-- Footer -->
  <text x="500" y="738" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">22 steps · soft-fail side effects (onFailure: skip) · retryable on analyze / plan / implement / review gates</text>
</svg>
