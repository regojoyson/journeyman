<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Journeyman — Architecture</text>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#64748b">Pluggable provider architecture · swap any adapter by editing one line of YAML</text>

  <!-- ─── Server ─────────────────────────────────────────────── -->
  <rect x="260" y="104" width="480" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="260" y="104" width="4" height="64" rx="2" fill="#2563eb"/>
  <text x="500" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Pipeline Server</text>
  <text x="500" y="152" text-anchor="middle" font-size="11" fill="#64748b">HTTP · webhooks · management API · trigger dispatch</text>

  <line x1="500" y1="172" x2="500" y2="204" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Pipeline Orchestrator ──────────────────────────────── -->
  <rect x="220" y="210" width="560" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="220" y="210" width="4" height="72" rx="2" fill="#059669"/>
  <text x="500" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Pipeline Orchestrator</text>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#64748b">flow execution · phases · state · artifacts · event bus</text>

  <line x1="500" y1="286" x2="500" y2="318" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ─── Providers label ────────────────────────────────────── -->
  <text x="500" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">PROVIDERS</text>

  <!-- ─── Provider slots ─────────────────────────────────────── -->
  <!-- Each provider: clean card with interface name + example impls -->

  <!-- Coding CLI -->
  <rect x="40" y="356" width="168" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="356" width="168" height="4" rx="2" fill="#7c3aed"/>
  <text x="124" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Coding CLI</text>
  <text x="124" y="404" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">ICodingCLI</text>
  <line x1="60" y1="418" x2="188" y2="418" stroke="#f1f5f9"/>
  <text x="124" y="438" text-anchor="middle" font-size="11" fill="#334155">Claude</text>
  <text x="124" y="456" text-anchor="middle" font-size="11" fill="#334155">OpenCode</text>
  <text x="124" y="474" text-anchor="middle" font-size="11" fill="#94a3b8">Gemini</text>
  <text x="124" y="492" text-anchor="middle" font-size="11" fill="#94a3b8">Codex</text>

  <!-- Git -->
  <rect x="224" y="356" width="168" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="224" y="356" width="168" height="4" rx="2" fill="#7c3aed"/>
  <text x="308" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Git</text>
  <text x="308" y="404" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">IGitProvider</text>
  <line x1="244" y1="418" x2="372" y2="418" stroke="#f1f5f9"/>
  <text x="308" y="438" text-anchor="middle" font-size="11" fill="#334155">GitHub</text>
  <text x="308" y="456" text-anchor="middle" font-size="11" fill="#94a3b8">GitLab</text>

  <!-- Ticket -->
  <rect x="408" y="356" width="168" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="408" y="356" width="168" height="4" rx="2" fill="#7c3aed"/>
  <text x="492" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Ticket</text>
  <text x="492" y="404" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">ITicketProvider</text>
  <line x1="428" y1="418" x2="556" y2="418" stroke="#f1f5f9"/>
  <text x="492" y="438" text-anchor="middle" font-size="11" fill="#334155">GitHub Issues</text>
  <text x="492" y="456" text-anchor="middle" font-size="11" fill="#334155">GitHub Projects</text>
  <text x="492" y="474" text-anchor="middle" font-size="11" fill="#94a3b8">Jira</text>
  <text x="492" y="492" text-anchor="middle" font-size="11" fill="#94a3b8">Linear · Monday</text>

  <!-- Notification -->
  <rect x="592" y="356" width="168" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="592" y="356" width="168" height="4" rx="2" fill="#7c3aed"/>
  <text x="676" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Notification</text>
  <text x="676" y="404" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">INotificationProvider</text>
  <line x1="612" y1="418" x2="740" y2="418" stroke="#f1f5f9"/>
  <text x="676" y="438" text-anchor="middle" font-size="11" fill="#334155">Console</text>
  <text x="676" y="456" text-anchor="middle" font-size="11" fill="#94a3b8">Slack</text>

  <!-- Extensibility slot -->
  <rect x="776" y="356" width="184" height="148" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="868" y="392" text-anchor="middle" font-size="28" font-weight="300" fill="#94a3b8">+</text>
  <text x="868" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Your Provider</text>
  <text x="868" y="446" text-anchor="middle" font-size="10" fill="#94a3b8">implement the</text>
  <text x="868" y="462" text-anchor="middle" font-size="10" fill="#94a3b8">interface,</text>
  <text x="868" y="478" text-anchor="middle" font-size="10" fill="#94a3b8">register, and</text>
  <text x="868" y="494" text-anchor="middle" font-size="10" fill="#94a3b8">reference by id</text>

  <!-- Connecting lines from orchestrator down to providers -->
  <line x1="124" y1="348" x2="124" y2="354" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="308" y1="348" x2="308" y2="354" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="492" y1="348" x2="492" y2="354" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="676" y1="348" x2="676" y2="354" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="868" y1="348" x2="868" y2="354" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="40" y1="348" x2="960" y2="348" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Footer caption -->
  <text x="500" y="536" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">Every provider satisfies an interface in @journeyman/core — implementations are resolved by id at boot.</text>
</svg>
