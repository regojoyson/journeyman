<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#475569"/></marker>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#f97316"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#dc2626"/></marker>
    <marker id="av" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#7c3aed"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#2563eb"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#d97706"/></marker>
  </defs>

  <rect width="1060" height="780" fill="#f8fafc"/>

  <!-- Title -->
  <text x="530" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Pipeline Orchestrator — Run Lifecycle</text>
  <text x="530" y="54" text-anchor="middle" font-size="11" fill="#64748b">How Pipeline.run() walks flow steps, threads artifacts, and emits events</text>

  <!-- ════════════════════════════════════════════════════════════
       LEFT COLUMN — Run status timeline
       ════════════════════════════════════════════════════════════ -->
  <text x="22" y="76" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">RUN STATUS TIMELINE</text>

  <!-- running -->
  <rect x="22" y="84" width="172" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="108" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">running</text>
  <text x="108" y="121" text-anchor="middle" font-size="9" fill="#2563eb">initial state on pipeline.run()</text>

  <line x1="108" y1="130" x2="108" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- step loop box -->
  <rect x="22" y="156" width="172" height="238" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#sh)"/>
  <text x="108" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">step loop</text>
  <text x="108" y="198" text-anchor="middle" font-size="10" fill="#059669">step 1 → ok</text>
  <text x="108" y="215" text-anchor="middle" font-size="10" fill="#059669">step 2 → ok</text>
  <text x="108" y="232" text-anchor="middle" font-size="10" fill="#94a3b8">…</text>
  <text x="108" y="252" text-anchor="middle" font-size="10" fill="#f97316">step K → failed → retry</text>
  <text x="108" y="269" text-anchor="middle" font-size="10" fill="#059669">step K → ok (attempt 2)</text>
  <text x="108" y="286" text-anchor="middle" font-size="10" fill="#94a3b8">…</text>
  <text x="108" y="308" text-anchor="middle" font-size="10" fill="#2563eb">step N → ok / blocked / failed</text>
  <text x="108" y="328" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">each step may be cancelled mid-flight</text>
  <text x="108" y="344" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">via ctx.signal (AbortController)</text>

  <line x1="108" y1="394" x2="108" y2="416" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="108" y1="356" x2="108" y2="378" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="108" y1="378" x2="108" y2="394" stroke="#64748b" stroke-width="1"/>

  <!-- terminal states -->
  <rect x="22" y="420" width="78" height="44" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="61" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">completed</text>
  <text x="61" y="454" text-anchor="middle" font-size="9" fill="#059669">all ok</text>

  <rect x="112" y="420" width="78" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="151" y="439" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">blocked</text>
  <text x="151" y="454" text-anchor="middle" font-size="9" fill="#b45309">waitFor hint</text>

  <rect x="22" y="474" width="78" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="61" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">failed</text>
  <text x="61" y="508" text-anchor="middle" font-size="9" fill="#991b1b">exhausted</text>

  <rect x="112" y="474" width="78" height="44" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" filter="url(#sh)"/>
  <text x="151" y="493" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">cancelled</text>
  <text x="151" y="508" text-anchor="middle" font-size="9" fill="#4b5563">signal</text>

  <!-- resume arrow from blocked back into loop -->
  <path d="M 190 442 Q 212 380 212 320 Q 212 270 194 240" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#av)"/>
  <text x="222" y="358" font-size="9" fill="#7c3aed" font-style="italic" transform="rotate(-90,222,358)">resume()</text>

  <!-- ════════════════════════════════════════════════════════════
       CENTER COLUMN — Per-step execution
       ════════════════════════════════════════════════════════════ -->
  <text x="250" y="76" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">PER-STEP EXECUTION</text>

  <!-- Stage 1 -->
  <rect x="250" y="84" width="430" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="465" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">① Resolve phase · Save step record</text>
  <text x="465" y="123" text-anchor="middle" font-size="10" fill="#2563eb">PhaseRegistry.resolve(step.phase) → IPhase</text>
  <text x="465" y="139" text-anchor="middle" font-size="10" fill="#2563eb">state.save(run) · eventBus.emit("stepStarted")</text>

  <line x1="465" y1="156" x2="465" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="250" y="180" width="430" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <text x="465" y="202" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">② Build step signal · Run phase</text>
  <text x="465" y="220" text-anchor="middle" font-size="10" fill="#ea580c">AbortSignal.any([ctx.signal, AbortSignal.timeout(step.timeoutMs)])</text>
  <text x="465" y="237" text-anchor="middle" font-size="10" fill="#ea580c">phase.run(stepCtx, step.config)</text>
  <text x="465" y="254" text-anchor="middle" font-size="9" fill="#f97316" font-style="italic">ctx.providers.{coding, git, ticket, notification}</text>

  <line x1="465" y1="268" x2="465" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="250" y="292" width="430" height="72" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="465" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">③ Record outcome · Merge artifacts</text>
  <text x="465" y="331" text-anchor="middle" font-size="10" fill="#059669">ok → merge returned artifacts into ctx.artifacts</text>
  <text x="465" y="347" text-anchor="middle" font-size="10" fill="#059669">state.save(run) · eventBus.emit("stepEnded")</text>

  <line x1="465" y1="364" x2="465" y2="384" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Branch boxes -->
  <rect x="252" y="388" width="86" height="60" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="295" y="408" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">ok</text>
  <text x="295" y="424" text-anchor="middle" font-size="9" fill="#15803d">continue</text>
  <text x="295" y="438" text-anchor="middle" font-size="9" fill="#15803d">next step</text>

  <rect x="350" y="388" width="86" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="393" y="408" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">blocked</text>
  <text x="393" y="424" text-anchor="middle" font-size="9" fill="#b45309">finish(blocked)</text>
  <text x="393" y="438" text-anchor="middle" font-size="9" fill="#b45309">return</text>

  <rect x="448" y="388" width="106" height="60" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <text x="501" y="408" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">failed + retry</text>
  <text x="501" y="424" text-anchor="middle" font-size="9" fill="#c2410c">sleep(backoffMs)</text>
  <text x="501" y="438" text-anchor="middle" font-size="9" fill="#c2410c">loop ↺ to stage ②</text>

  <rect x="566" y="388" width="110" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="621" y="408" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">failed</text>
  <text x="621" y="424" text-anchor="middle" font-size="9" fill="#991b1b">onFailure →</text>
  <text x="621" y="438" text-anchor="middle" font-size="9" fill="#991b1b">fail / skip / block</text>

  <!-- retry loop back arrow -->
  <path d="M 501 448 Q 501 476 465 180" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="510" y="480" font-size="9" fill="#f97316" font-style="italic">attempt + 1</text>

  <!-- ════════════════════════════════════════════════════════════
       RIGHT COLUMN — Collaborators
       ════════════════════════════════════════════════════════════ -->
  <text x="710" y="76" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">COLLABORATORS</text>

  <rect x="710" y="84" width="330" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="106" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">PhaseRegistry</text>
  <text x="875" y="122" text-anchor="middle" font-size="9" fill="#64748b">step.phase → IPhase factory · resolves at runtime</text>

  <rect x="710" y="146" width="330" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">ProviderRegistry</text>
  <text x="875" y="184" text-anchor="middle" font-size="9" fill="#64748b">resolveForProduct(flow, productConfig)</text>

  <rect x="710" y="208" width="330" height="52" rx="8" fill="white" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">FileStateStore</text>
  <text x="875" y="246" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/state/&lt;sid&gt;.json · atomic write</text>

  <rect x="710" y="270" width="330" height="52" rx="8" fill="white" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">FileTraceLogger</text>
  <text x="875" y="308" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/logs/&lt;sid&gt;/&lt;step&gt;.log · JSON lines</text>

  <rect x="710" y="332" width="330" height="52" rx="8" fill="white" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#78350f">FileArtifactStore</text>
  <text x="875" y="370" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/artifacts/&lt;sid&gt;/&lt;key&gt;.&lt;ext&gt;</text>

  <rect x="710" y="394" width="330" height="52" rx="8" fill="white" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="416" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">EventBus</text>
  <text x="875" y="432" text-anchor="middle" font-size="9" fill="#7c3aed">in-process pub/sub · 500-event ring buffer</text>

  <rect x="710" y="456" width="330" height="56" rx="8" fill="white" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="875" y="478" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">AbortController (per run)</text>
  <text x="875" y="494" text-anchor="middle" font-size="9" fill="#991b1b">cancel() signals ctx.signal · linked to</text>
  <text x="875" y="508" text-anchor="middle" font-size="9" fill="#991b1b">AbortSignal.timeout(step.timeoutMs) per step</text>

  <!-- Arrows from center stages to collaborators -->
  <line x1="680" y1="110" x2="708" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="680" y1="136" x2="708" y2="172" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="680" y1="330" x2="708" y2="234" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ay)"/>
  <line x1="680" y1="330" x2="708" y2="296" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ay)"/>
  <line x1="680" y1="330" x2="708" y2="358" stroke="#d97706" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ay)"/>
  <line x1="680" y1="198" x2="708" y2="420" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#av)"/>
  <line x1="680" y1="240" x2="708" y2="480" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ar)"/>

  <!-- ════════════════════════════════════════════════════════════
       BOTTOM — Artifact bag
       ════════════════════════════════════════════════════════════ -->
  <rect x="16" y="536" width="1028" height="228" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="36" y="560" font-size="13" font-weight="700" fill="#0f172a">ctx.artifacts — shared bag that grows step by step</text>
  <text x="36" y="577" font-size="10" fill="#64748b" font-style="italic">Each phase declares static reads[] / writes[] — boot validator proves every read key has a producer before any run starts.</text>

  <!-- artifact columns -->
  <rect x="36" y="590" width="180" height="156" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="126" y="608" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">after getTicket</text>
  <text x="52" y="626" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">ticket</text>
  <text x="52" y="642" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">ticketMd</text>

  <line x1="216" y1="668" x2="232" y2="668" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>

  <rect x="232" y="590" width="192" height="156" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="328" y="608" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">after clone + analyze</text>
  <text x="248" y="626" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">ticket, ticketMd</text>
  <text x="248" y="642" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">repoPaths</text>
  <text x="248" y="658" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">primaryRepoPath</text>
  <text x="248" y="674" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">repoRefs</text>
  <text x="248" y="690" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">analysis {…, reportHandle}</text>

  <line x1="424" y1="668" x2="440" y2="668" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>

  <rect x="440" y="590" width="210" height="156" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="545" y="608" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">after plan + implement</text>
  <text x="456" y="626" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#94a3b8">(prior keys)</text>
  <text x="456" y="642" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">plan {…, reportHandle}</text>
  <text x="456" y="658" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">implementation</text>
  <text x="456" y="674" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">  {filesChanged[], reportHandle}</text>

  <line x1="650" y1="668" x2="666" y2="668" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/>

  <rect x="666" y="590" width="210" height="156" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="771" y="608" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">after commit + PR</text>
  <text x="682" y="626" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#94a3b8">(prior keys)</text>
  <text x="682" y="642" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">commit {branch, sha,</text>
  <text x="682" y="658" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">  title, description}</text>
  <text x="682" y="674" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">pr {url, number, id}</text>
  <text x="682" y="690" font-family="'JetBrains Mono',monospace,ui-monospace" font-size="9" fill="#0f172a">commentIds[stepId]</text>

  <!-- Rules card -->
  <rect x="896" y="590" width="132" height="156" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="962" y="608" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">Artifact rules</text>
  <text x="912" y="626" font-size="9" fill="#15803d">• one object per phase</text>
  <text x="912" y="642" font-size="9" fill="#15803d">• key = producer name</text>
  <text x="912" y="658" font-size="9" fill="#15803d">• blobs → handle</text>
  <text x="912" y="674" font-size="9" fill="#15803d">  (not raw path)</text>
  <text x="912" y="690" font-size="9" fill="#15803d">• persisted to state</text>
  <text x="912" y="706" font-size="9" fill="#15803d">  after every step</text>
  <text x="912" y="722" font-size="9" fill="#15803d">• survive cleanup</text>
  <text x="912" y="738" font-size="9" fill="#15803d">  phase (handles)</text>
</svg>
