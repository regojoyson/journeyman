<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#94a3b8"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Pipeline Orchestrator</text>
  <text x="500" y="66" text-anchor="middle" font-size="12" fill="#64748b">Walks a flow of steps · each step runs a phase · artifacts flow through the run</text>

  <!-- ─── Flow steps (horizontal chain) ──────────────────────── -->
  <text x="74" y="122" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">FLOW</text>

  <g font-size="11">
    <rect x="74"  y="132" width="110" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="129" y="159" text-anchor="middle" fill="#0f172a">getTicket</text>

    <line x1="184" y1="154" x2="204" y2="154" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="204" y="132" width="110" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="259" y="159" text-anchor="middle" fill="#0f172a">analyze</text>

    <line x1="314" y1="154" x2="334" y2="154" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="334" y="132" width="110" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="389" y="159" text-anchor="middle" fill="#0f172a">plan</text>

    <line x1="444" y1="154" x2="464" y2="154" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="464" y="132" width="110" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="519" y="159" text-anchor="middle" fill="#0f172a">implement</text>

    <line x1="574" y1="154" x2="594" y2="154" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="594" y="132" width="110" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
    <text x="649" y="159" text-anchor="middle" fill="#0f172a">createPR</text>

    <text x="724" y="159" font-size="14" fill="#94a3b8">· · ·</text>
  </g>

  <!-- Zoom indicator -->
  <path d="M 389 176 L 389 210 L 200 230" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 389 176 L 389 210 L 800 230" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="203" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">for each step...</text>

  <!-- ─── Per-step execution ─────────────────────────────────── -->
  <rect x="200" y="234" width="600" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="200" y="234" width="4" height="100" rx="2" fill="#059669"/>

  <text x="500" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Run the step</text>

  <!-- 3 sub-stages as pills -->
  <rect x="232" y="276" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="312" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">① resolve phase</text>
  <text x="312" y="310" text-anchor="middle" font-size="9" fill="#64748b">PhaseRegistry lookup</text>

  <rect x="420" y="276" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="500" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">② execute phase</text>
  <text x="500" y="310" text-anchor="middle" font-size="9" fill="#64748b">timeout · retry · cancel</text>

  <rect x="608" y="276" width="160" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">③ record outcome</text>
  <text x="688" y="310" text-anchor="middle" font-size="9" fill="#64748b">merge into artifacts · save</text>

  <!-- ─── Outcomes ───────────────────────────────────────────── -->
  <line x1="500" y1="340" x2="500" y2="372" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="500" y="390" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">OUTCOME</text>

  <g font-size="11">
    <!-- ok -->
    <rect x="108" y="402" width="180" height="68" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="128" cy="430" r="5" fill="#059669"/>
    <text x="144" y="434" font-weight="700" fill="#065f46">ok</text>
    <text x="128" y="454" font-size="10" fill="#64748b">→ continue to next step</text>

    <!-- blocked -->
    <rect x="308" y="402" width="180" height="68" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="328" cy="430" r="5" fill="#d97706"/>
    <text x="344" y="434" font-weight="700" fill="#78350f">blocked</text>
    <text x="328" y="454" font-size="10" fill="#64748b">→ pause · resume later</text>

    <!-- retry -->
    <rect x="508" y="402" width="180" height="68" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="528" cy="430" r="5" fill="#f97316"/>
    <text x="544" y="434" font-weight="700" fill="#7c2d12">retry</text>
    <text x="528" y="454" font-size="10" fill="#64748b">→ backoff · re-run step</text>

    <!-- failed -->
    <rect x="708" y="402" width="180" height="68" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="728" cy="430" r="5" fill="#dc2626"/>
    <text x="744" y="434" font-weight="700" fill="#7f1d1d">failed</text>
    <text x="728" y="454" font-size="10" fill="#64748b">→ stop · run marked failed</text>
  </g>

  <!-- ─── Context lanes (side labels) ────────────────────────── -->
  <rect x="74" y="502" width="852" height="60" rx="10" fill="#fafafa" stroke="#e2e8f0"/>

  <text x="94" y="524" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="2">THREADED THROUGH EVERY STEP</text>

  <text x="94" y="548" font-size="11" fill="#334155">
    <tspan font-weight="600" fill="#0f172a">ctx.artifacts</tspan>
    <tspan fill="#64748b"> — accumulating bag of step outputs  ·  </tspan>
    <tspan font-weight="600" fill="#0f172a">ctx.providers</tspan>
    <tspan fill="#64748b"> — resolved adapter instances  ·  </tspan>
    <tspan font-weight="600" fill="#0f172a">ctx.signal</tspan>
    <tspan fill="#64748b"> — cancel / timeout  ·  </tspan>
    <tspan font-weight="600" fill="#0f172a">state</tspan>
    <tspan fill="#64748b"> — persisted after each step</tspan>
  </text>
</svg>
