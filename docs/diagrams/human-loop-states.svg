<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="a"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#475569"/></marker>
    <marker id="ae" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#059669"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#f97316"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#dc2626"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f8fafc"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">reviewLoop — State Machine</text>
  <text x="480" y="54" text-anchor="middle" font-size="11" fill="#64748b">One reviewLoop step across successive resumes — transitions driven by ticket status values</text>

  <!-- ─── States ─────────────────────────────────────────────── -->

  <!-- Start node -->
  <circle cx="84" cy="290" r="22" fill="#1e40af" filter="url(#sh)"/>
  <text x="84" y="330" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">start</text>

  <!-- BLOCKED -->
  <rect x="208" y="238" width="200" height="104" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" filter="url(#sh)"/>
  <text x="308" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">BLOCKED</text>
  <text x="308" y="288" text-anchor="middle" font-size="10" fill="#b45309">run.status = blocked</text>
  <text x="308" y="305" text-anchor="middle" font-size="10" fill="#b45309">waitFor = "ticket-status-change"</text>
  <text x="308" y="322" text-anchor="middle" font-size="10" fill="#b45309">cycles = N</text>

  <!-- REWORKING -->
  <rect x="504" y="140" width="222" height="120" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
  <text x="615" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">REWORKING</text>
  <text x="615" y="190" text-anchor="middle" font-size="10" fill="#c2410c">run onRework sub-phases</text>
  <text x="615" y="207" text-anchor="middle" font-size="10" fill="#c2410c">fetch* → plan → implement</text>
  <text x="615" y="224" text-anchor="middle" font-size="10" fill="#c2410c">→ commitPushRepos</text>
  <text x="615" y="241" text-anchor="middle" font-size="10" fill="#c2410c">cycles += 1</text>

  <!-- DONE -->
  <rect x="504" y="370" width="222" height="74" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
  <text x="615" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">DONE (ok)</text>
  <text x="615" y="422" text-anchor="middle" font-size="10" fill="#15803d">pipeline continues forward</text>
  <text x="615" y="438" text-anchor="middle" font-size="10" fill="#15803d">next step executes</text>

  <!-- FAILED -->
  <rect x="756" y="258" width="180" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
  <text x="846" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">FAILED</text>
  <text x="846" y="312" text-anchor="middle" font-size="10" fill="#991b1b">maxCycles exceeded or</text>
  <text x="846" y="328" text-anchor="middle" font-size="10" fill="#991b1b">sub-phase error</text>

  <!-- ─── Transitions ────────────────────────────────────────── -->

  <!-- start → BLOCKED -->
  <line x1="106" y1="290" x2="206" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="156" y="282" text-anchor="middle" font-size="9" fill="#475569">first entry</text>

  <!-- BLOCKED → REWORKING -->
  <path d="M 370 250 Q 420 190 502 190" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#ao)"/>
  <text x="390" y="205" font-size="10" fill="#c2410c">resume(status = reworkStatus)</text>
  <text x="390" y="220" font-size="10" fill="#c2410c" font-style="italic">cycles &lt; maxCycles</text>

  <!-- REWORKING → BLOCKED (loop back, sub-phases done) -->
  <path d="M 504 218 Q 420 246 408 258" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ao)"/>
  <text x="432" y="240" font-size="9" fill="#c2410c" font-style="italic">sub-phases done → block again</text>

  <!-- BLOCKED → DONE -->
  <path d="M 370 338 Q 430 420 502 410" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ae)"/>
  <text x="406" y="408" font-size="10" fill="#065f46">resume(status = approveStatus)</text>

  <!-- BLOCKED → FAILED (cycles ≥ max) -->
  <path d="M 408 288 Q 580 288 754 298" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="580" y="280" text-anchor="middle" font-size="10" fill="#991b1b">resume(status = reworkStatus) &amp; cycles ≥ maxCycles</text>

  <!-- REWORKING → FAILED (sub-phase error) -->
  <path d="M 726 210 Q 800 236 808 256" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="802" y="234" font-size="9" fill="#991b1b">sub-phase fails</text>

  <!-- BLOCKED → BLOCKED (unknown status) -->
  <path d="M 260 238 Q 218 198 250 234" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="180" y="208" font-size="9" fill="#64748b">resume(unknown status)</text>
  <text x="180" y="222" font-size="9" fill="#64748b" font-style="italic">→ block again</text>

  <!-- ─── Invariants panel ──────────────────────────────────── -->
  <rect x="22" y="492" width="916" height="132" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="42" y="518" font-size="13" font-weight="700" fill="#0f172a">Invariants</text>

  <text x="42" y="540" font-size="11" fill="#334155">•  Exactly one reviewLoop step is active per run. Its cycle counter lives at artifacts[${stepId}_cycles].</text>
  <text x="42" y="558" font-size="11" fill="#334155">•  The step is re-run on every resume — not skipped. BLOCKED → BLOCKED transitions are valid (unknown status is a no-op).</text>
  <text x="42" y="576" font-size="11" fill="#334155">•  __resumeStatus is transient: set before the step runs, cleared after it returns.</text>
  <text x="42" y="594" font-size="11" fill="#334155">•  onRework sub-phases are invoked through the same PhaseRegistry used by the main runner — each is independently testable.</text>
  <text x="42" y="612" font-size="11" fill="#334155">•  Sub-phase failure short-circuits the cycle → reviewLoop returns failed → run fails (no silent retry).</text>
</svg>
