<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="st-arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="st-arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="st-arr-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="st-arr-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#fafafa" rx="8"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">reviewLoop — State Machine</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#64748b">One reviewLoop step, viewed as transitions across successive resumes</text>

  <!-- States -->
  <!-- Start -->
  <circle cx="100" cy="300" r="18" fill="#1e40af"/>
  <text x="100" y="336" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="600">start</text>

  <!-- Blocked -->
  <rect x="230" y="260" width="170" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="315" y="285" text-anchor="middle" font-weight="700" fill="#92400e">BLOCKED</text>
  <text x="315" y="305" text-anchor="middle" font-size="10" fill="#92400e">run.status=blocked</text>
  <text x="315" y="320" text-anchor="middle" font-size="10" fill="#92400e">waitFor="ticket-comment"</text>
  <text x="315" y="335" text-anchor="middle" font-size="10" fill="#92400e">cycles=N</text>

  <!-- Rework -->
  <rect x="510" y="160" width="200" height="100" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="610" y="185" text-anchor="middle" font-weight="700" fill="#9a3412">REWORKING</text>
  <text x="610" y="205" text-anchor="middle" font-size="10" fill="#9a3412">run onRework sub-phases</text>
  <text x="610" y="220" text-anchor="middle" font-size="10" fill="#9a3412">fetch* → plan → implement</text>
  <text x="610" y="235" text-anchor="middle" font-size="10" fill="#9a3412">→ commitPush</text>
  <text x="610" y="250" text-anchor="middle" font-size="10" fill="#9a3412">cycles += 1</text>

  <!-- Done (ok) -->
  <rect x="530" y="380" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="405" text-anchor="middle" font-weight="700" fill="#166534">DONE (ok)</text>
  <text x="610" y="422" text-anchor="middle" font-size="10" fill="#166534">pipeline continues forward</text>
  <text x="610" y="436" text-anchor="middle" font-size="10" fill="#166534">{stepId}_outcome="approved"</text>

  <!-- Failed -->
  <rect x="770" y="280" width="160" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="850" y="305" text-anchor="middle" font-weight="700" fill="#991b1b">FAILED</text>
  <text x="850" y="322" text-anchor="middle" font-size="10" fill="#991b1b">maxCycles exceeded or</text>
  <text x="850" y="336" text-anchor="middle" font-size="10" fill="#991b1b">sub-phase error</text>

  <!-- Transitions -->
  <!-- start → blocked -->
  <line x1="118" y1="300" x2="228" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#st-arr)"/>
  <text x="170" y="292" text-anchor="middle" font-size="10" fill="#475569">first entry</text>

  <!-- blocked → reworking (status = reworkStatus) -->
  <path d="M 365 260 Q 400 200 510 200" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#st-arr-o)"/>
  <text x="420" y="195" font-size="10" fill="#9a3412">resume(status=reworkStatus)</text>
  <text x="420" y="210" font-size="10" fill="#9a3412" font-style="italic">cycles &lt; maxCycles</text>

  <!-- reworking → blocked (loop back) -->
  <path d="M 510 230 Q 380 230 395 260" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#st-arr-o)"/>
  <text x="430" y="250" font-size="10" fill="#9a3412">sub-phases complete → block again</text>

  <!-- blocked → done (status = approveStatus) -->
  <path d="M 365 340 Q 470 420 528 410" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#st-arr-g)"/>
  <text x="420" y="410" font-size="10" fill="#166534">resume(status=approveStatus)</text>

  <!-- blocked → failed (cycles >= max) -->
  <path d="M 400 300 Q 600 310 770 305" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#st-arr-r)"/>
  <text x="555" y="297" text-anchor="middle" font-size="10" fill="#991b1b">resume(status=reworkStatus) &amp; cycles ≥ max</text>

  <!-- blocked → blocked (unknown status) -->
  <path d="M 270 260 Q 230 210 265 245" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#st-arr)"/>
  <text x="200" y="220" font-size="10" fill="#475569">resume(unknown status)</text>
  <text x="210" y="234" font-size="10" fill="#475569" font-style="italic">→ block again</text>

  <!-- reworking → failed (sub-phase error) -->
  <path d="M 710 210 Q 820 230 840 275" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#st-arr-r)"/>
  <text x="800" y="240" font-size="10" fill="#991b1b">sub-phase fails</text>

  <!-- Notes panel -->
  <rect x="60" y="440" width="880" height="150" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="80" y="465" font-size="13" font-weight="700" fill="#374151">Invariants</text>
  <text x="80" y="486" font-size="11" fill="#334155">• Exactly one reviewLoop step is active at a time per run; its cycle counter lives at artifacts[${stepId}_cycles].</text>
  <text x="80" y="505" font-size="11" fill="#334155">• The step is re-run on every resume — not skipped. BLOCKED → BLOCKED transitions are valid (unknown status).</text>
  <text x="80" y="524" font-size="11" fill="#334155">• __resumeStatus is transient: runner sets it before the step, clears it after.</text>
  <text x="80" y="543" font-size="11" fill="#334155">• onRework sub-phases are called through the same registry used by the runner; each is independently testable.</text>
  <text x="80" y="562" font-size="11" fill="#334155">• Sub-phase failure short-circuits the cycle → reviewLoop returns failed → run fails (no silent retries).</text>
  <text x="80" y="581" font-size="11" fill="#334155">• approveStatus / reworkStatus / maxCycles are per-step config — analyze, plan, and code review can all differ.</text>
</svg>
