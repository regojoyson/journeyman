<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#94a3b8"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 L1.5,4Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1100" height="660" fill="#f8fafc"/>

  <!-- ── TITLE ── -->
  <text x="550" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Journeyman — AI Orchestration for Software Teams</text>
  <text x="550" y="62" text-anchor="middle" font-size="12" fill="#64748b">Connect your existing tools · Automate the full development lifecycle · Human-in-the-loop by design</text>
  <line x1="30" y1="74" x2="1070" y2="74" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── LEFT COLUMN: Ticket Sources ── -->
  <text x="107" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af" letter-spacing="0.6">TICKET SOURCES</text>

  <rect x="20" y="107" width="175" height="52" rx="8" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="107" y="131" text-anchor="middle" fill="white" font-weight="600" font-size="13">Jira</text>
  <text x="107" y="148" text-anchor="middle" fill="#bfdbfe" font-size="10">Issues &amp; Epics</text>

  <rect x="20" y="169" width="175" height="52" rx="8" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="107" y="193" text-anchor="middle" fill="white" font-weight="600" font-size="13">Linear</text>
  <text x="107" y="210" text-anchor="middle" fill="#bfdbfe" font-size="10">Issues &amp; Cycles</text>

  <rect x="20" y="231" width="175" height="52" rx="8" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="107" y="255" text-anchor="middle" fill="white" font-weight="600" font-size="13">GitHub Issues</text>
  <text x="107" y="272" text-anchor="middle" fill="#bfdbfe" font-size="10">Webhooks &amp; Labels</text>

  <rect x="20" y="293" width="175" height="52" rx="8" fill="#1d4ed8" filter="url(#sh)"/>
  <text x="107" y="317" text-anchor="middle" fill="white" font-weight="600" font-size="13">Monday.com</text>
  <text x="107" y="334" text-anchor="middle" fill="#bfdbfe" font-size="10">Boards &amp; Items</text>

  <!-- Arrows: left column → center core -->
  <line x1="195" y1="133" x2="222" y2="226" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="195" y1="195" x2="222" y2="246" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="195" y1="257" x2="222" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="195" y1="319" x2="222" y2="280" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── CENTER: Journeyman Core Engine ── -->
  <rect x="225" y="84" width="648" height="490" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <!-- dark header bar -->
  <rect x="225" y="84" width="648" height="48" rx="12" fill="#1e293b"/>
  <rect x="225" y="108" width="648" height="24" fill="#1e293b"/>
  <text x="549" y="113" text-anchor="middle" fill="white" font-size="15" font-weight="700">Journeyman Orchestration Engine</text>
  <text x="549" y="148" text-anchor="middle" font-size="11" fill="#64748b">Provider-agnostic · Visual flow editor · Retryable steps · Human-in-the-loop</text>

  <!-- Phase card: Analyze -->
  <rect x="250" y="160" width="598" height="74" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="250" y="160" width="10" height="74" rx="4" fill="#7c3aed"/>
  <text x="275" y="183" font-size="11" font-weight="700" fill="#4c1d95">① ANALYZE</text>
  <text x="275" y="201" font-size="11" fill="#5b21b6">AI reads the entire codebase, scores complexity (trivial → very-high), and flags risks,</text>
  <text x="275" y="217" font-size="11" fill="#5b21b6">ambiguities, and coverage gaps before a single line of code is written.</text>
  <text x="275" y="230" font-size="10" fill="#7c3aed">Output: findings report · severity scores · readinessScore · recommendations</text>

  <!-- Phase card: Plan -->
  <rect x="250" y="244" width="598" height="74" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="250" y="244" width="10" height="74" rx="4" fill="#7c3aed"/>
  <text x="275" y="267" font-size="11" font-weight="700" fill="#4c1d95">② PLAN</text>
  <text x="275" y="285" font-size="11" fill="#5b21b6">AI generates a step-by-step implementation plan: which files to touch, acceptance criteria,</text>
  <text x="275" y="301" font-size="11" fill="#5b21b6">test strategy, rollout notes, and open questions surfaced for the team to resolve.</text>
  <text x="275" y="314" font-size="10" fill="#7c3aed">Output: ordered steps · affected files · test strategy · rollout plan · open questions</text>

  <!-- Phase card: Human Review Gate -->
  <rect x="250" y="328" width="598" height="74" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="250" y="328" width="10" height="74" rx="4" fill="#d97706"/>
  <text x="275" y="351" font-size="11" font-weight="700" fill="#78350f">③ HUMAN REVIEW GATE</text>
  <text x="275" y="369" font-size="11" fill="#92400e">Workflow pauses — the team reviews the AI's plan and either approves or adds review</text>
  <text x="275" y="385" font-size="11" fill="#92400e">comments. Reviewer feedback is automatically fed back into the next AI phase.</text>
  <text x="275" y="398" font-size="10" fill="#b45309">Mandatory approval checkpoint — no code is written without explicit team sign-off</text>

  <!-- Phase card: Implement -->
  <rect x="250" y="412" width="598" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="250" y="412" width="10" height="74" rx="4" fill="#16a34a"/>
  <text x="275" y="435" font-size="11" font-weight="700" fill="#14532d">④ IMPLEMENT</text>
  <text x="275" y="453" font-size="11" fill="#15803d">AI executes the approved plan in an isolated workspace: writes code, runs tests, and</text>
  <text x="275" y="469" font-size="11" fill="#15803d">produces a full audit trail of every file changed with a per-change summary.</text>
  <text x="275" y="482" font-size="10" fill="#16a34a">Output: filesChanged · step results · testsRun · testsPassed · follow-up items</text>

  <!-- Capabilities strip -->
  <rect x="250" y="496" width="598" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="549" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Platform Capabilities</text>
  <text x="549" y="533" text-anchor="middle" font-size="10" fill="#475569">Conditional branching · Per-step retry &amp; backoff · Secrets management · Per-phase AI model override</text>
  <text x="549" y="549" text-anchor="middle" font-size="10" fill="#475569">MCP extension points · Real-time run logs &amp; artifact storage · Org / User / Global workflow scopes</text>

  <!-- ── ARROWS: Center → Right column ── -->
  <line x1="873" y1="198" x2="900" y2="136" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="873" y1="288" x2="900" y2="198" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="873" y1="368" x2="900" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="873" y1="446" x2="900" y2="322" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ── RIGHT COLUMN: Outputs ── -->
  <text x="991" y="97" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d" letter-spacing="0.6">OUTPUTS</text>

  <rect x="902" y="107" width="178" height="52" rx="8" fill="#059669" filter="url(#sh)"/>
  <text x="991" y="131" text-anchor="middle" fill="white" font-weight="600" font-size="13">GitHub Pull Request</text>
  <text x="991" y="148" text-anchor="middle" fill="#a7f3d0" font-size="10">Ready for engineering review</text>

  <rect x="902" y="169" width="178" height="52" rx="8" fill="#059669" filter="url(#sh)"/>
  <text x="991" y="193" text-anchor="middle" fill="white" font-weight="600" font-size="13">GitLab Merge Request</text>
  <text x="991" y="210" text-anchor="middle" fill="#a7f3d0" font-size="10">Full change log included</text>

  <rect x="902" y="231" width="178" height="52" rx="8" fill="#f97316" filter="url(#sh)"/>
  <text x="991" y="255" text-anchor="middle" fill="white" font-weight="600" font-size="13">Slack Notification</text>
  <text x="991" y="272" text-anchor="middle" fill="#fed7aa" font-size="10">Team status updates</text>

  <rect x="902" y="293" width="178" height="52" rx="8" fill="#475569" filter="url(#sh)"/>
  <text x="991" y="317" text-anchor="middle" fill="white" font-weight="600" font-size="13">Artifacts &amp; Reports</text>
  <text x="991" y="334" text-anchor="middle" fill="#cbd5e1" font-size="10">Analyze · Plan · Impl reports</text>

  <!-- ── BOTTOM: AI Providers strip ── -->
  <rect x="225" y="590" width="648" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="549" y="612" text-anchor="middle" font-size="11" font-weight="600" fill="#4c1d95">AI CODING PROVIDERS — plug in any, swap at any time, or override per workflow step</text>

  <rect x="250" y="622" width="170" height="16" rx="4" fill="#7c3aed"/>
  <text x="335" y="634" text-anchor="middle" fill="white" font-size="9" font-weight="600">Claude  (Anthropic)</text>

  <rect x="436" y="622" width="170" height="16" rx="4" fill="#7c3aed"/>
  <text x="521" y="634" text-anchor="middle" fill="white" font-size="9" font-weight="600">Gemini  (Google)</text>

  <rect x="622" y="622" width="170" height="16" rx="4" fill="#7c3aed"/>
  <text x="707" y="634" text-anchor="middle" fill="white" font-size="9" font-weight="600">Codex  (OpenAI)</text>

  <!-- Dashed arrow: AI Providers → core -->
  <line x1="549" y1="590" x2="549" y2="574" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ap)"/>
</svg>
