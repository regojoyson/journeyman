<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="a-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="a-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/>
    </marker>
    <marker id="a-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="a-p" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#fafafa" rx="8"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Pipeline Orchestrator — Run Lifecycle</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#64748b">How Pipeline.run() walks flow steps, threads artifacts, and emits events</text>

  <!-- ═══ Left column: Run state timeline ═══ -->
  <text x="40" y="90" font-size="11" font-weight="600" fill="#475569">PIPELINERUN STATUS</text>

  <rect x="40" y="105" width="150" height="38" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="115" y="123" text-anchor="middle" font-weight="600" fill="#075985" font-size="11">running</text>
  <text x="115" y="137" text-anchor="middle" font-size="9" fill="#0284c7">initial state on run()</text>

  <line x1="115" y1="143" x2="115" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="170" width="150" height="210" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-dasharray="3,2"/>
  <text x="115" y="190" text-anchor="middle" font-weight="600" fill="#166534" font-size="10">step loop</text>
  <text x="115" y="210" text-anchor="middle" font-size="10" fill="#15803d">step 1 → ok</text>
  <text x="115" y="225" text-anchor="middle" font-size="10" fill="#15803d">step 2 → ok</text>
  <text x="115" y="240" text-anchor="middle" font-size="10" fill="#15803d">…</text>
  <text x="115" y="258" text-anchor="middle" font-size="10" fill="#f97316">step K → failed → retry</text>
  <text x="115" y="275" text-anchor="middle" font-size="10" fill="#f97316">step K → ok (attempt 2)</text>
  <text x="115" y="293" text-anchor="middle" font-size="10" fill="#15803d">…</text>
  <text x="115" y="315" text-anchor="middle" font-size="10" fill="#0284c7">step N → ?</text>
  <text x="115" y="330" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">(ok / blocked / failed)</text>
  <text x="115" y="358" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">each step may also be</text>
  <text x="115" y="371" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">cancelled mid-flight</text>

  <line x1="115" y1="380" x2="115" y2="410" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Terminal states -->
  <rect x="30" y="415" width="80" height="38" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="70" y="433" text-anchor="middle" font-weight="600" fill="#14532d" font-size="11">completed</text>
  <text x="70" y="447" text-anchor="middle" font-size="9" fill="#166534">all ok</text>

  <rect x="120" y="415" width="80" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="160" y="433" text-anchor="middle" font-weight="600" fill="#78350f" font-size="11">blocked</text>
  <text x="160" y="447" text-anchor="middle" font-size="9" fill="#b45309">waitFor hint</text>

  <rect x="30" y="460" width="80" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="70" y="478" text-anchor="middle" font-weight="600" fill="#7f1d1d" font-size="11">failed</text>
  <text x="70" y="492" text-anchor="middle" font-size="9" fill="#991b1b">exhausted</text>

  <rect x="120" y="460" width="80" height="38" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="160" y="478" text-anchor="middle" font-weight="600" fill="#1f2937" font-size="11">cancelled</text>
  <text x="160" y="492" text-anchor="middle" font-size="9" fill="#4b5563">signal</text>

  <!-- resume arrow -->
  <path d="M 200 435 Q 215 400 220 350" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a-p)" stroke-dasharray="4,3"/>
  <text x="232" y="395" font-size="9" fill="#7c3aed" font-style="italic">resume()</text>

  <!-- ═══ Center: Step execution detail ═══ -->
  <text x="280" y="90" font-size="11" font-weight="600" fill="#475569">PER-STEP EXECUTION (runStepWithAttempts)</text>

  <rect x="280" y="105" width="420" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="490" y="125" text-anchor="middle" font-weight="600" fill="#075985">1. Resolve phase · Save StepRecord</text>
  <text x="490" y="140" text-anchor="middle" font-size="10" fill="#0284c7">phases.resolve(step.phase) → IPhase instance</text>
  <text x="490" y="154" text-anchor="middle" font-size="10" fill="#0284c7">state.save(run) · emit stepStarted</text>

  <line x1="490" y1="165" x2="490" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="280" y="193" width="420" height="82" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="490" y="213" text-anchor="middle" font-weight="600" fill="#9a3412">2. Build step signal · Run phase</text>
  <text x="490" y="229" text-anchor="middle" font-size="10" fill="#c2410c">anySignal([ctx.signal, AbortSignal.timeout(step.timeoutMs)])</text>
  <text x="490" y="246" text-anchor="middle" font-size="10" fill="#c2410c">phase.run(stepCtx, step.config) · catches throw → failed</text>
  <text x="490" y="262" text-anchor="middle" font-size="9" fill="#ea580c" font-style="italic">uses ctx.providers.{ticket,git,coding,notification}</text>

  <line x1="490" y1="275" x2="490" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="280" y="303" width="420" height="62" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="490" y="323" text-anchor="middle" font-weight="600" fill="#14532d">3. Record outcome</text>
  <text x="490" y="339" text-anchor="middle" font-size="10" fill="#166534">ok → merge artifacts into ctx.artifacts</text>
  <text x="490" y="354" text-anchor="middle" font-size="10" fill="#166534">state.save(run) · emit stepEnded</text>

  <line x1="490" y1="365" x2="490" y2="390" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Branches -->
  <rect x="285" y="395" width="95" height="58" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="332" y="413" text-anchor="middle" font-weight="600" fill="#14532d" font-size="11">ok</text>
  <text x="332" y="429" text-anchor="middle" font-size="9" fill="#166534">next step</text>
  <text x="332" y="443" text-anchor="middle" font-size="9" fill="#166534">(break loop)</text>

  <rect x="395" y="395" width="95" height="58" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="442" y="413" text-anchor="middle" font-weight="600" fill="#78350f" font-size="11">blocked</text>
  <text x="442" y="429" text-anchor="middle" font-size="9" fill="#b45309">finish(blocked)</text>
  <text x="442" y="443" text-anchor="middle" font-size="9" fill="#b45309">return</text>

  <rect x="505" y="395" width="95" height="58" rx="6" fill="#fed7aa" stroke="#ea580c"/>
  <text x="552" y="413" text-anchor="middle" font-weight="600" fill="#7c2d12" font-size="11">failed + retry</text>
  <text x="552" y="429" text-anchor="middle" font-size="9" fill="#c2410c">sleep(backoffMs)</text>
  <text x="552" y="443" text-anchor="middle" font-size="9" fill="#c2410c">loop ↺</text>

  <rect x="615" y="395" width="85" height="58" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="657" y="413" text-anchor="middle" font-weight="600" fill="#7f1d1d" font-size="11">failed</text>
  <text x="657" y="429" text-anchor="middle" font-size="9" fill="#991b1b">onFailure →</text>
  <text x="657" y="443" text-anchor="middle" font-size="9" fill="#991b1b">fail/skip/block</text>

  <!-- retry loop back -->
  <path d="M 552 453 Q 552 480 490 188" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-o)"/>
  <text x="590" y="480" font-size="9" fill="#f97316" font-style="italic">attempt + 1</text>

  <!-- ═══ Right column: Infrastructure collaborators ═══ -->
  <text x="740" y="90" font-size="11" font-weight="600" fill="#475569">COLLABORATORS</text>

  <rect x="740" y="105" width="220" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="850" y="125" text-anchor="middle" font-weight="600" fill="#312e81" font-size="11">PhaseRegistry</text>
  <text x="850" y="141" text-anchor="middle" font-size="9" fill="#4338ca">stepId → IPhase factory</text>

  <rect x="740" y="155" width="220" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="850" y="175" text-anchor="middle" font-weight="600" fill="#312e81" font-size="11">ProviderRegistry</text>
  <text x="850" y="191" text-anchor="middle" font-size="9" fill="#4338ca">resolveForProduct(flow, productConfig)</text>

  <rect x="740" y="205" width="220" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="850" y="225" text-anchor="middle" font-weight="600" fill="#78350f" font-size="11">FileStateStore</text>
  <text x="850" y="241" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/state/&lt;sid&gt;.json · atomic</text>

  <rect x="740" y="255" width="220" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="850" y="275" text-anchor="middle" font-weight="600" fill="#78350f" font-size="11">FileTraceLogger</text>
  <text x="850" y="291" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/logs/&lt;sid&gt;/&lt;step&gt;.log · JSON lines</text>

  <rect x="740" y="305" width="220" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="850" y="325" text-anchor="middle" font-weight="600" fill="#78350f" font-size="11">FileArtifactStore</text>
  <text x="850" y="341" text-anchor="middle" font-size="9" fill="#b45309">&lt;product&gt;/artifacts/&lt;sid&gt;/&lt;key&gt;.&lt;ext&gt;</text>

  <rect x="740" y="355" width="220" height="44" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="850" y="375" text-anchor="middle" font-weight="600" fill="#6b21a8" font-size="11">EventBus</text>
  <text x="850" y="391" text-anchor="middle" font-size="9" fill="#7c3aed">pub/sub · 500-event ring buffer</text>

  <rect x="740" y="405" width="220" height="48" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="850" y="423" text-anchor="middle" font-weight="600" fill="#7f1d1d" font-size="11">AbortController per run</text>
  <text x="850" y="439" text-anchor="middle" font-size="9" fill="#991b1b">cancel() aborts signal; linked to</text>
  <text x="850" y="450" text-anchor="middle" font-size="9" fill="#991b1b">AbortSignal.timeout(step.timeoutMs)</text>

  <!-- Arrows from center to collaborators -->
  <line x1="700" y1="125" x2="740" y2="125" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="700" y1="165" x2="740" y2="175" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a)"/>
  <line x1="700" y1="335" x2="740" y2="227" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-o)"/>
  <line x1="700" y1="335" x2="740" y2="275" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-o)"/>
  <line x1="700" y1="335" x2="740" y2="327" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-o)"/>
  <line x1="700" y1="155" x2="740" y2="377" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-p)"/>
  <line x1="700" y1="244" x2="740" y2="425" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#a-r)"/>

  <!-- ═══ Artifact bag panel (bottom) ═══ -->
  <rect x="40" y="520" width="920" height="180" rx="8" fill="white" stroke="#e5e7eb"/>
  <text x="60" y="542" font-weight="700" fill="#1e293b">ctx.artifacts — shared bag that grows step by step</text>
  <text x="60" y="558" font-size="10" fill="#64748b" font-style="italic">Each phase declares static reads[] / writes[] — boot validator proves every read has a producer.</text>

  <!-- artifact columns as they grow -->
  <rect x="60" y="570" width="150" height="118" rx="4" fill="#f1f5f9"/>
  <text x="135" y="586" text-anchor="middle" font-weight="600" font-size="10" fill="#334155">after getTicket</text>
  <text x="68" y="602" font-family="monospace" font-size="9" fill="#0f172a">ticket</text>
  <text x="68" y="615" font-family="monospace" font-size="9" fill="#0f172a">ticketMd</text>

  <rect x="220" y="570" width="150" height="118" rx="4" fill="#f1f5f9"/>
  <text x="295" y="586" text-anchor="middle" font-weight="600" font-size="10" fill="#334155">after clone + analyze</text>
  <text x="228" y="602" font-family="monospace" font-size="9" fill="#0f172a">ticket, ticketMd</text>
  <text x="228" y="615" font-family="monospace" font-size="9" fill="#0f172a">repoPaths</text>
  <text x="228" y="628" font-family="monospace" font-size="9" fill="#0f172a">primaryRepoPath</text>
  <text x="228" y="641" font-family="monospace" font-size="9" fill="#0f172a">repoRefs</text>
  <text x="228" y="654" font-family="monospace" font-size="9" fill="#0f172a">analysis {…, reportHandle}</text>

  <rect x="380" y="570" width="170" height="118" rx="4" fill="#f1f5f9"/>
  <text x="465" y="586" text-anchor="middle" font-weight="600" font-size="10" fill="#334155">after plan + implement</text>
  <text x="388" y="602" font-family="monospace" font-size="9" fill="#0f172a">(prior keys)</text>
  <text x="388" y="615" font-family="monospace" font-size="9" fill="#0f172a">plan {…, reportHandle}</text>
  <text x="388" y="628" font-family="monospace" font-size="9" fill="#0f172a">implementation</text>
  <text x="388" y="641" font-family="monospace" font-size="9" fill="#0f172a">  {filesChanged[], reportHandle}</text>
  <text x="388" y="654" font-family="monospace" font-size="9" fill="#0f172a">statusHistory[]</text>

  <rect x="560" y="570" width="170" height="118" rx="4" fill="#f1f5f9"/>
  <text x="645" y="586" text-anchor="middle" font-weight="600" font-size="10" fill="#334155">after commit + PR</text>
  <text x="568" y="602" font-family="monospace" font-size="9" fill="#0f172a">(prior keys)</text>
  <text x="568" y="615" font-family="monospace" font-size="9" fill="#0f172a">commit {branch, commitSha,</text>
  <text x="568" y="628" font-family="monospace" font-size="9" fill="#0f172a">  title, description, pushed}</text>
  <text x="568" y="641" font-family="monospace" font-size="9" fill="#0f172a">pr {url, number, id}</text>
  <text x="568" y="654" font-family="monospace" font-size="9" fill="#0f172a">commentIds[stepId]</text>

  <rect x="740" y="570" width="200" height="118" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="840" y="586" text-anchor="middle" font-weight="600" font-size="10" fill="#14532d">Rules</text>
  <text x="748" y="600" font-size="9" fill="#166534">• one-object-per-phase</text>
  <text x="748" y="614" font-size="9" fill="#166534">• keys named after producer</text>
  <text x="748" y="628" font-size="9" fill="#166534">• file blobs → artifactStore</text>
  <text x="748" y="642" font-size="9" fill="#166534">  handles, not raw paths</text>
  <text x="748" y="656" font-size="9" fill="#166534">• persisted in state file</text>
  <text x="748" y="670" font-size="9" fill="#166534">  after every step</text>

  <!-- flow arrows between artifact columns -->
  <line x1="210" y1="628" x2="220" y2="628" stroke="#22c55e" stroke-width="1" marker-end="url(#a-g)"/>
  <line x1="370" y1="628" x2="380" y2="628" stroke="#22c55e" stroke-width="1" marker-end="url(#a-g)"/>
  <line x1="550" y1="628" x2="560" y2="628" stroke="#22c55e" stroke-width="1" marker-end="url(#a-g)"/>
</svg>
