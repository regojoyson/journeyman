<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1480" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="30" font-weight="700" fill="#111827">PDLC + AIDLC Workflow</text>
  <text x="445" y="46" font-size="20" font-weight="600" fill="#6b7280">· BMAD · multi-repo</text>
  <text x="40" y="74" font-size="15" fill="#6b7280">Idea → shipped feature. AI agents do the work each phase; humans approve the key gates; all context lives in one Project Hub.</text>

  <!-- Three pillars -->
  <g>
    <rect x="40" y="96" width="453" height="78" rx="10" fill="#eef4ff" stroke="#0052cc"/>
    <text x="60" y="124" font-size="16" font-weight="700" fill="#0052cc">JIRA — status spine</text>
    <text x="60" y="146" font-size="12.5" fill="#374151">Holds where work is. Thin: status + minimal</text>
    <text x="60" y="163" font-size="12.5" fill="#374151">fields. A status change triggers the next agent.</text>

    <rect x="513" y="96" width="453" height="78" rx="10" fill="#ecfdf3" stroke="#16a34a"/>
    <text x="533" y="124" font-size="16" font-weight="700" fill="#16a34a">PROJECT HUB — context brain</text>
    <text x="533" y="146" font-size="12.5" fill="#374151">New repo. All PRD / epics / stories / UX /</text>
    <text x="533" y="163" font-size="12.5" fill="#374151">architecture as markdown. Single source of truth.</text>

    <rect x="986" y="96" width="454" height="78" rx="10" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="1006" y="124" font-size="16" font-weight="700" fill="#4b5563">ENGINE — pluggable</text>
    <text x="1006" y="146" font-size="12.5" fill="#374151">Runs agents + gates. Journeyman = reference</text>
    <text x="1006" y="163" font-size="12.5" fill="#374151">implementation. Swappable (GitHub Actions, …).</text>
  </g>

  <!-- Zone bands -->
  <rect x="40" y="200" width="668" height="30" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="374" y="220" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">ZONE 1 · Hub-driven (Epics — no Jira yet)</text>
  <rect x="768" y="200" width="668" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1102" y="220" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">ZONE 2 · Jira-driven (Stories — your dev workflow)</text>

  <!-- Phase cards -->
  <!-- card template: x positions 40,268,496,(gap)768,996,1224 ; w=212 ; y=250 h=210 -->

  <!-- 1 Discovery -->
  <rect x="40" y="250" width="212" height="210" rx="10" fill="#fbfaff" stroke="#d1d5db"/>
  <rect x="40" y="250" width="6" height="105" fill="#a855f7"/>
  <rect x="40" y="355" width="6" height="105" fill="#3b82f6"/>
  <text x="62" y="280" font-size="16" font-weight="700" fill="#111827">1 · Discovery</text>
  <text x="62" y="299" font-size="10" font-weight="700" fill="#7c3aed">PRODUCT + TECH</text>
  <text x="62" y="324" font-size="12.5" font-weight="600" fill="#374151">Analyst · Architect</text>
  <text x="62" y="346" font-size="11.5" fill="#6b7280">Mine knowledge bases.</text>
  <text x="62" y="362" font-size="11.5" fill="#6b7280">Collaborative, multi-round.</text>
  <text x="62" y="384" font-size="11.5" fill="#374151">→ Feature + Tech epics</text>
  <rect x="62" y="416" width="86" height="22" rx="11" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="105" y="431" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="middle">ITERATE</text>
  <rect x="154" y="416" width="64" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="186" y="431" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GATE</text>

  <!-- 2 Design -->
  <rect x="268" y="250" width="212" height="210" rx="10" fill="#fdf9ff" stroke="#d1d5db"/>
  <rect x="268" y="250" width="6" height="210" fill="#a855f7"/>
  <text x="290" y="280" font-size="16" font-weight="700" fill="#111827">2 · Design</text>
  <text x="290" y="299" font-size="10" font-weight="700" fill="#7c3aed">PRODUCT</text>
  <text x="290" y="324" font-size="12.5" font-weight="600" fill="#374151">UX Expert</text>
  <text x="290" y="349" font-size="11.5" fill="#6b7280">UX flows, wireframes,</text>
  <text x="290" y="365" font-size="11.5" fill="#6b7280">design spec.</text>
  <text x="290" y="387" font-size="11.5" fill="#374151">→ epics/EPIC-x/ux/</text>
  <rect x="290" y="416" width="120" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="350" y="431" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GATE · PO/Designer</text>

  <!-- 3 Grooming -->
  <rect x="496" y="250" width="212" height="210" rx="10" fill="#fdf9ff" stroke="#d1d5db"/>
  <rect x="496" y="250" width="6" height="210" fill="#a855f7"/>
  <text x="518" y="280" font-size="16" font-weight="700" fill="#111827">3 · Grooming</text>
  <text x="518" y="299" font-size="10" font-weight="700" fill="#7c3aed">PRODUCT · SM bridge</text>
  <text x="518" y="324" font-size="12.5" font-weight="600" fill="#374151">PM + PO</text>
  <text x="518" y="349" font-size="11.5" fill="#6b7280">PRD → shard into</text>
  <text x="518" y="365" font-size="11.5" fill="#6b7280">ranked stories.</text>
  <text x="518" y="387" font-size="11.5" fill="#374151">→ Story docs (Hub)</text>
  <rect x="518" y="416" width="104" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="431" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GATE · PO/PM</text>

  <!-- HANDOFF arrow between zones -->
  <line x1="712" y1="355" x2="764" y2="355" stroke="#111827" stroke-width="2.5" marker-end="url(#arrowBold)"/>
  <text x="738" y="480" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">HANDOFF</text>
  <text x="738" y="495" font-size="10.5" fill="#374151" text-anchor="middle">stories →</text>
  <text x="738" y="509" font-size="10.5" fill="#374151" text-anchor="middle">Jira (NEW)</text>

  <!-- 4 Solution -->
  <rect x="768" y="250" width="212" height="210" rx="10" fill="#f9fbff" stroke="#d1d5db"/>
  <rect x="768" y="250" width="6" height="210" fill="#3b82f6"/>
  <text x="790" y="280" font-size="16" font-weight="700" fill="#111827">4 · Solution</text>
  <text x="790" y="299" font-size="10" font-weight="700" fill="#2563eb">DEVELOPER (+ PO)</text>
  <text x="790" y="324" font-size="12.5" font-weight="600" fill="#374151">Architect + SM</text>
  <text x="790" y="349" font-size="11.5" fill="#6b7280">Architecture, impact,</text>
  <text x="790" y="365" font-size="11.5" fill="#6b7280">API/DB. Sizing + sprints.</text>
  <text x="790" y="387" font-size="11.5" fill="#374151">→ architecture.md</text>
  <rect x="790" y="416" width="138" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="859" y="431" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GATE · Architect/Lead</text>

  <!-- 5 Implementation -->
  <rect x="996" y="250" width="212" height="210" rx="10" fill="#f9fbff" stroke="#d1d5db"/>
  <rect x="996" y="250" width="6" height="210" fill="#3b82f6"/>
  <text x="1018" y="280" font-size="16" font-weight="700" fill="#111827">5 · Implement</text>
  <text x="1018" y="299" font-size="10" font-weight="700" fill="#2563eb">DEVELOPER</text>
  <text x="1018" y="324" font-size="12.5" font-weight="600" fill="#374151">SM → Dev → QA</text>
  <text x="1018" y="349" font-size="11.5" fill="#6b7280">Code (multi-repo PRs),</text>
  <text x="1018" y="365" font-size="11.5" fill="#6b7280">tests, review, QA gate.</text>
  <text x="1018" y="387" font-size="11.5" fill="#374151">→ code + tests</text>
  <rect x="1018" y="416" width="62" height="22" rx="11" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="1049" y="431" font-size="10.5" font-weight="700" fill="#4b5563" text-anchor="middle">AUTO</text>
  <rect x="1086" y="416" width="110" height="22" rx="11" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1141" y="431" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">GATE ON FLAG</text>

  <!-- 6 Release -->
  <rect x="1224" y="250" width="212" height="210" rx="10" fill="#f9fbff" stroke="#d1d5db"/>
  <rect x="1224" y="250" width="6" height="210" fill="#3b82f6"/>
  <text x="1246" y="280" font-size="16" font-weight="700" fill="#111827">6 · Release</text>
  <text x="1246" y="299" font-size="10" font-weight="700" fill="#2563eb">DEVELOPER (+ PO)</text>
  <text x="1246" y="324" font-size="12.5" font-weight="600" fill="#374151">Deploy + Verify</text>
  <text x="1246" y="349" font-size="11.5" fill="#6b7280">CI/CD, smoke tests,</text>
  <text x="1246" y="365" font-size="11.5" fill="#6b7280">API health, rollback.</text>
  <text x="1246" y="387" font-size="11.5" fill="#374151">→ DONE</text>
  <rect x="1246" y="416" width="116" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1304" y="431" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">GATE · PO/QA</text>

  <!-- arrows between cards -->
  <line x1="252" y1="355" x2="266" y2="355" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="355" x2="494" y2="355" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="355" x2="994" y2="355" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1208" y1="355" x2="1222" y2="355" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="548" font-size="12.5" font-weight="700" fill="#374151">LEGEND</text>
  <rect x="110" y="537" width="14" height="14" rx="3" fill="#a855f7"/>
  <text x="130" y="548" font-size="12" fill="#374151">Product lane</text>
  <rect x="228" y="537" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="248" y="548" font-size="12" fill="#374151">Developer lane</text>
  <rect x="360" y="537" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text x="380" y="548" font-size="12" fill="#374151">GATE = human approval (blocks)</text>
  <rect x="600" y="537" width="14" height="14" rx="3" fill="#9ca3af"/>
  <text x="620" y="548" font-size="12" fill="#374151">AUTO = agent advances</text>
  <rect x="790" y="537" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="810" y="548" font-size="12" fill="#374151">FLAG = auto-escalate to a gate</text>
  <text x="1030" y="548" font-size="12" fill="#374151">Humans are notified every phase.</text>

  <!-- Inside every phase: the loop -->
  <text x="40" y="592" font-size="14" font-weight="700" fill="#111827">Inside every phase — the loop</text>
  <g font-size="11.5" fill="#374151">
    <rect x="40" y="606" width="206" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="56" y="630" font-weight="700" fill="#111827">1 · Trigger</text>
    <text x="56" y="649">status / state change</text>

    <rect x="270" y="606" width="206" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="286" y="630" font-weight="700" fill="#111827">2 · Select agent</text>
    <text x="286" y="649">engine maps phase</text>

    <rect x="500" y="606" width="206" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="516" y="630" font-weight="700" fill="#111827">3 · Sandbox</text>
    <text x="516" y="649">clone Hub + repos</text>

    <rect x="730" y="606" width="206" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="746" y="630" font-weight="700" fill="#111827">4 · Work</text>
    <text x="746" y="649">write to Hub (PR)</text>

    <rect x="960" y="606" width="206" height="56" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="976" y="630" font-weight="700" fill="#b45309">5 · Human gate</text>
    <text x="976" y="649">notify · block · escalate</text>

    <rect x="1190" y="606" width="246" height="56" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="1206" y="630" font-weight="700" fill="#111827">6 · Sync + advance</text>
    <text x="1206" y="649">mirror to Jira → next phase</text>
  </g>
  <line x1="246" y1="634" x2="268" y2="634" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="634" x2="498" y2="634" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="706" y1="634" x2="728" y2="634" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="936" y1="634" x2="958" y2="634" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1166" y1="634" x2="1188" y2="634" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sync rule -->
  <rect x="40" y="686" width="1396" height="88" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="62" y="714" font-size="14" font-weight="700" fill="#111827">Sync rule — no drift</text>
  <text x="62" y="740" font-size="12.5" fill="#374151"><tspan font-weight="700" fill="#16a34a">CONTENT  →</tspan>  Hub is canonical. Story/epic docs create &amp; update the Jira issue (title, description, links).</text>
  <text x="62" y="762" font-size="12.5" fill="#374151"><tspan font-weight="700" fill="#0052cc">STATUS  ←</tspan>  Jira is canonical. A status change is echoed (read-only) into the doc's frontmatter.</text>
  <text x="980" y="740" font-size="12" fill="#6b7280">Two one-way flows on different fields →</text>
  <text x="980" y="758" font-size="12" fill="#6b7280">they can never conflict. Story <tspan font-family="monospace">id</tspan> stable;</text>
  <text x="980" y="774" font-size="12" fill="#6b7280"><tspan font-family="monospace">jiraKey</tspan> written back once, link never breaks.</text>
</svg>
