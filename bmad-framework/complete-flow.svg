<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1520" height="700" fill="#ffffff"/>

  <text x="24" y="36" font-size="23" font-weight="800" fill="#111827">PDLC + AIDLC — the complete flow</text>
  <text x="24" y="58" font-size="13" fill="#6b7280">Read left→right for the journey; read a column down to see, for that phase: the Jira status, the BMAD agent, the Hub artifact, repo activity, and the gate.</text>

  <!-- zone banners -->
  <rect x="160" y="72" width="666" height="22" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="493" y="87" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">ZONE 1 · Hub-driven (epics, no Jira yet)</text>
  <rect x="834" y="72" width="662" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1165" y="87" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">ZONE 2 · Jira status-driven (stories)</text>

  <!-- phase headers -->
  <g font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="166" y="100" width="148" height="40" rx="9" fill="#a855f7"/><text x="240" y="125" fill="#fff">1 · Discovery</text>
    <rect x="322" y="100" width="148" height="40" rx="9" fill="#a855f7"/><text x="396" y="125" fill="#fff">2 · Design</text>
    <rect x="478" y="100" width="148" height="40" rx="9" fill="#a855f7"/><text x="552" y="125" fill="#fff">3 · Grooming</text>
    <rect x="668" y="100" width="148" height="40" rx="9" fill="#3b82f6"/><text x="742" y="125" fill="#fff">4 · Scoping</text>
    <rect x="824" y="100" width="172" height="40" rx="9" fill="#3b82f6"/><text x="910" y="125" fill="#fff">5 · Implementation</text>
    <rect x="1004" y="100" width="172" height="40" rx="9" fill="#3b82f6"/><text x="1090" y="125" fill="#fff">6 · Release</text>
  </g>
  <!-- progression chevrons -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="314" y1="120" x2="320" y2="120" marker-end="url(#ar)"/>
    <line x1="470" y1="120" x2="476" y2="120" marker-end="url(#ar)"/>
    <line x1="626" y1="120" x2="666" y2="120" marker-end="url(#ar)"/>
    <line x1="816" y1="120" x2="822" y2="120" marker-end="url(#ar)"/>
    <line x1="996" y1="120" x2="1002" y2="120" marker-end="url(#ar)"/>
  </g>
  <!-- handoff marker between zone1 and zone2 -->
  <text x="646" y="160" font-size="9.5" fill="#6b7280" text-anchor="middle">handoff:</text>
  <text x="646" y="171" font-size="9.5" fill="#6b7280" text-anchor="middle">stories→Jira</text>

  <!-- lane bands -->
  <g>
    <rect x="160" y="180" width="1336" height="92" fill="#f8fbff"/>
    <rect x="160" y="276" width="1336" height="104" fill="#fbf9ff"/>
    <rect x="160" y="384" width="1336" height="78" fill="#f4fdf7"/>
    <rect x="160" y="466" width="1336" height="74" fill="#f7f8fa"/>
    <rect x="160" y="544" width="1336" height="60" fill="#fffdf5"/>
  </g>

  <!-- lane labels -->
  <g font-size="11.5" font-weight="700">
    <text x="24" y="212" fill="#2563eb">JIRA</text><text x="24" y="227" font-size="9.5" font-weight="400" fill="#9ca3af">status</text>
    <text x="24" y="322" fill="#6d28d9">BMAD</text><text x="24" y="337" font-size="9.5" font-weight="400" fill="#9ca3af">agent</text>
    <circle cx="28" cy="352" r="4" fill="#16a34a"/><text x="37" y="356" font-size="9" font-weight="400" fill="#9ca3af">Agent</text>
    <circle cx="28" cy="366" r="4" fill="#7c3aed"/><text x="37" y="370" font-size="9" font-weight="400" fill="#9ca3af">Workflow</text>
    <text x="24" y="420" fill="#16a34a">PROJECT</text><text x="24" y="434" fill="#16a34a">HUB</text>
    <text x="24" y="506" fill="#4b5563">GITLAB</text><text x="24" y="520" fill="#4b5563">REPOS</text>
    <text x="24" y="578" fill="#b45309">GATE</text>
  </g>

  <!-- column separators -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="160" y1="180" x2="160" y2="604"/>
    <line x1="316" y1="180" x2="316" y2="604"/>
    <line x1="472" y1="180" x2="472" y2="604"/>
    <line x1="628" y1="180" x2="628" y2="604" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <line x1="818" y1="180" x2="818" y2="604"/>
    <line x1="998" y1="180" x2="998" y2="604"/>
    <line x1="1178" y1="180" x2="1178" y2="604"/>
  </g>
  <!-- lane divider lines -->
  <g stroke="#eef0f2" stroke-width="1">
    <line x1="160" y1="272" x2="1496" y2="272"/>
    <line x1="160" y1="380" x2="1496" y2="380"/>
    <line x1="160" y1="462" x2="1496" y2="462"/>
    <line x1="160" y1="540" x2="1496" y2="540"/>
  </g>

  <!-- ===== JIRA lane ===== -->
  <g font-size="10" fill="#1e3a8a">
    <text x="176" y="216" fill="#9ca3af">— epic phase (no Jira)</text>
    <text x="332" y="216" fill="#9ca3af">—</text>
    <text x="488" y="210" fill="#9ca3af">— epic phase</text>
    <text x="488" y="226" font-weight="700" fill="#2563eb">▸ emits story = NEW</text>
    <!-- scoping -->
    <text x="636" y="204" font-weight="700">PM SCOPING</text>
    <text x="636" y="222" font-weight="700">ARCHITECTURE SCOPING</text>
    <text x="636" y="240" font-weight="700">READY FOR DEVELOPMENT</text>
    <!-- impl -->
    <text x="828" y="204" font-weight="700">IN PROGRESS</text>
    <text x="828" y="222" font-weight="700">AWAITING / IN CODE REVIEW</text>
    <text x="828" y="240" font-weight="700">READY FOR TESTING / TESTING</text>
    <!-- release -->
    <text x="1008" y="200" font-weight="700">PRE-RELEASE VERIFICATION</text>
    <text x="1008" y="216" font-weight="700">TO BE DEPLOYED</text>
    <text x="1008" y="232" font-weight="700">POST-RELEASE VERIFICATION</text>
    <text x="1008" y="248" font-weight="700">READY FOR RELEASE → DONE</text>
  </g>

  <!-- ===== BMAD agent lane — one pill per agent (green dot=Agent, purple dot=Workflow) ===== -->
  <g font-size="11" fill="#374151">
    <!-- Discovery (WF, parallel) -->
    <rect x="172" y="290" width="132" height="22" rx="6" fill="#fff" stroke="#c4b5fd"/><circle cx="185" cy="301" r="4" fill="#7c3aed"/><text x="197" y="305">analyst</text>
    <rect x="172" y="318" width="132" height="22" rx="6" fill="#fff" stroke="#c4b5fd"/><circle cx="185" cy="329" r="4" fill="#7c3aed"/><text x="197" y="333">architect</text>
    <text x="172" y="358" font-size="9" fill="#9ca3af">workflow · parallel</text>
    <!-- Design (AG) -->
    <rect x="328" y="290" width="132" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="341" cy="301" r="4" fill="#16a34a"/><text x="353" y="305">ux</text>
    <!-- Grooming (WF, sequence) -->
    <rect x="484" y="290" width="132" height="22" rx="6" fill="#fff" stroke="#c4b5fd"/><circle cx="497" cy="301" r="4" fill="#7c3aed"/><text x="509" y="305">pm</text>
    <rect x="484" y="318" width="132" height="22" rx="6" fill="#fff" stroke="#c4b5fd"/><circle cx="497" cy="329" r="4" fill="#7c3aed"/><text x="509" y="333">po</text>
    <rect x="484" y="346" width="132" height="22" rx="6" fill="#fff" stroke="#c4b5fd"/><circle cx="497" cy="357" r="4" fill="#7c3aed"/><text x="509" y="361">sm</text>
    <!-- Scoping (AG) -->
    <rect x="640" y="290" width="166" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="653" cy="301" r="4" fill="#16a34a"/><text x="665" y="305">pm</text>
    <rect x="640" y="318" width="166" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="653" cy="329" r="4" fill="#16a34a"/><text x="665" y="333">architect</text>
    <!-- Implementation (AG) -->
    <rect x="830" y="290" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="843" cy="301" r="4" fill="#16a34a"/><text x="855" y="305">dev</text>
    <rect x="830" y="318" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="843" cy="329" r="4" fill="#16a34a"/><text x="855" y="333">code-review</text>
    <rect x="830" y="346" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="843" cy="357" r="4" fill="#16a34a"/><text x="855" y="361">qa</text>
    <!-- Release (AG) -->
    <rect x="1010" y="290" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="1023" cy="301" r="4" fill="#16a34a"/><text x="1035" y="305">release</text>
    <rect x="1010" y="318" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="1023" cy="329" r="4" fill="#16a34a"/><text x="1035" y="333">deploy</text>
    <rect x="1010" y="346" width="156" height="22" rx="6" fill="#fff" stroke="#86efac"/><circle cx="1023" cy="357" r="4" fill="#16a34a"/><text x="1035" y="361">prod-verify</text>
  </g>

  <!-- ===== Hub lane ===== -->
  <g font-size="10.5" fill="#166534">
    <text x="176" y="412">Feature + Technical</text><text x="176" y="427">epics</text>
    <text x="332" y="412">ux/design-spec.md</text>
    <text x="488" y="412">stories/STORY-*.md</text>
    <text x="636" y="412">architecture.md</text><text x="636" y="427">+ ADRs</text>
    <text x="828" y="412">story DoD,</text><text x="828" y="427">test results</text>
    <text x="1008" y="412">release-notes.md</text>
  </g>

  <!-- ===== Repos lane ===== -->
  <g font-size="10.5" fill="#475569">
    <text x="176" y="496">inspect (read-only)</text>
    <text x="332" y="496">—</text>
    <text x="488" y="496">—</text>
    <text x="636" y="496">inspect (read-only)</text>
    <text x="828" y="490" font-weight="700" fill="#334155">code + 1 MR / repo</text>
    <text x="828" y="505">branch PROJ-###-…</text>
    <text x="1008" y="496">deploy via CI/CD</text>
  </g>

  <!-- ===== Gate lane ===== -->
  <g font-size="10" font-weight="700" text-anchor="middle">
    <rect x="172" y="556" width="132" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="238" y="570" fill="#b45309">PO / PM / Architect</text>
    <rect x="328" y="556" width="132" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="394" y="570" fill="#b45309">PO / Designer</text>
    <rect x="484" y="556" width="132" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="550" y="570" fill="#b45309">PO / PM</text>
    <rect x="676" y="556" width="132" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="742" y="570" fill="#b45309">Architect</text>
    <rect x="844" y="556" width="132" height="20" rx="10" fill="#f3f4f6" stroke="#cbd5e1"/><text x="910" y="570" fill="#6b7280">on-flag only</text>
    <rect x="1024" y="556" width="132" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="1090" y="570" fill="#b45309">PO · QA/PO</text>
  </g>

  <!-- right column: the constant systems -->
  <rect x="1196" y="180" width="300" height="360" rx="12" fill="#fbfcfd" stroke="#cbd5e1"/>
  <text x="1212" y="204" font-size="12.5" font-weight="700" fill="#4b5563">Constant across every phase</text>
  <text x="1212" y="230" font-size="11" fill="#16a34a" font-weight="700">PROJECT HUB</text>
  <text x="1212" y="246" font-size="10.5" fill="#374151">cloned as project-hub/ — context</text>
  <text x="1212" y="260" font-size="10.5" fill="#374151">+ bmad-core/ (the agents)</text>
  <text x="1212" y="286" font-size="11" fill="#4b5563" font-weight="700">JOURNEYMAN ENGINE</text>
  <text x="1212" y="302" font-size="10.5" fill="#374151">triggers · clones workspace ·</text>
  <text x="1212" y="316" font-size="10.5" fill="#374151">runs the agent / workflow</text>
  <text x="1212" y="342" font-size="11" fill="#3730a3" font-weight="700">MCPs</text>
  <text x="1212" y="358" font-size="10.5" fill="#374151">Jira MCP → status + comments</text>
  <text x="1212" y="372" font-size="10.5" fill="#374151">GitLab MCP → MRs + diffs</text>
  <text x="1212" y="398" font-size="11" fill="#b45309" font-weight="700">THE KEY</text>
  <text x="1212" y="414" font-size="10.5" fill="#374151">Jira Key (PROJ-###) is the</text>
  <text x="1212" y="428" font-size="10.5" fill="#374151">unique id: story jiraKey,</text>
  <text x="1212" y="442" font-size="10.5" fill="#374151">branch, MR title, commit.</text>
  <text x="1212" y="468" font-size="11" fill="#2563eb" font-weight="700">GATE MODEL</text>
  <text x="1212" y="484" font-size="10.5" fill="#374151">notify always · block at the</text>
  <text x="1212" y="498" font-size="10.5" fill="#374151">amber gates · escalate on flag</text>
  <text x="1212" y="512" font-size="10.5" fill="#374151">(agent comments, leaves status)</text>

  <!-- footer -->
  <text x="24" y="638" font-size="11.5" fill="#6b7280">Zones 1–3 run in the Hub (a human merges the Hub MR to advance the epic's phase). From Grooming on, each story is a Jira ticket whose status triggers its agent.</text>
  <text x="24" y="656" font-size="11.5" fill="#6b7280">All agents run with no output — they act through the MCPs. Implementation is one autonomous Dev agent (opens an MR per repo); Discovery &amp; Grooming are workflows because they run several agents.</text>
</svg>
