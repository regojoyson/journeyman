name: default

providers:
  ticket:       github-projects
  git:          github
  coding:       claude
  notification: slack          # stub — not called by any step below

steps:
  - id: fetch-ticket
    phase: getTicket

  - id: clone
    phase: cloneRepos
    timeoutMs: 120000
    retry:
      attempts: 2
      backoffMs: 5000

  - id: mark-in-progress
    phase: updateStatus
    config:
      status: In progress
    onFailure: skip

  - id: analyze
    phase: analyze
    timeoutMs: 900000

  - id: plan
    phase: plan
    timeoutMs: 900000

  - id: implement
    phase: implement
    timeoutMs: 1800000

  - id: commit-push
    phase: commitPushRepos
    config:
      pattern: "#{ticket} : {summary}"
      prSummaryStyle: detailed
    retry:
      attempts: 2
      backoffMs: 3000

  - id: open-pr
    phase: createPR
    onFailure: skip

  - id: mark-in-review
    phase: updateStatus
    config:
      status: Code Review
    onFailure: skip

  - id: cleanup
    phase: cleanupRepos
    onFailure: skip
