name: advanced-flow

providers:
  ticket:       github-issues
  git:          github
  coding:       claude
  notification: console

steps:
  - id: fetch-ticket
    phase: getTicket

  - id: clone
    phase: cloneRepos
    timeoutMs: 120000

  - id: mark-in-progress
    phase: updateStatus
    config: { status: development-started }
    onFailure: skip

  - id: checkout
    phase: checkoutRepo

  - id: analyze
    phase: analyze
    retryable: true

  - id: comment-analyze
    phase: addComment
    config: { template: "analysis-summary" }
    onFailure: skip

  - id: notify-analyze-ready
    phase: notify
    config: { message: "Analysis ready for #{ticket}" }
    onFailure: skip

  - id: plan
    phase: plan
    retryable: true

  - id: commit-push-plan
    phase: commitPushRepos
    config:
      pattern: "#{ticket} : plan"
    onFailure: skip

  - id: open-pr-plan
    phase: createPR
    onFailure: skip

  - id: comment-pr-plan
    phase: addComment
    config: { template: "plan-summary" }
    onFailure: skip

  - id: plan-review
    phase: reviewLoop
    config:
      approveStatus: plan-approved
      reworkStatus: plan-rework-requested
      maxCycles: 3
      onRework: [fetchPRComments, plan, commitPushRepos]
    retryable: true

  - id: notify-plan-ready
    phase: notify
    config: { message: "Plan ready for #{ticket} — please approve" }
    onFailure: skip

  - id: implement
    phase: implement
    retryable: true

  - id: commit-push
    phase: commitPushRepos
    config:
      pattern: "#{ticket} : {summary}"

  - id: comment-pr
    phase: addComment
    config: { template: "pr-opened" }
    onFailure: skip

  - id: notify-pr-ready
    phase: notify
    config: { message: "PR ready for #{ticket}" }
    onFailure: skip

  - id: mark-in-review
    phase: updateStatus
    config: { status: code-review }
    onFailure: skip

  - id: code-review
    phase: reviewLoop
    config:
      approveStatus: completed
      reworkStatus: rework-requested
      maxCycles: 3
      onRework: [fetchPRComments, plan, implement, commitPushRepos]
    retryable: true  

  - id: notify-complete
    phase: notify
    config: { message: "#{ticket} completed" }
    onFailure: skip

  - id: comment-complete
    phase: addComment
    config: { template: "completion-summary" }
    onFailure: skip

  - id: cleanup
    phase: cleanupRepos
    onFailure: skip
