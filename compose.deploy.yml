# compose.deploy.yml — FULL Journeyman deployment (infra + all apps).
# Run with: npm run compose:up / compose:down / compose:reset
# For the dev-only dependency stack (postgres+redis+conductor) see infra/compose.dev.yml.
# Host ports use a 6000 series to avoid clashing with the dev stack.
# Container ports are unchanged, so in-network URLs stay standard.
name: journeyman-deploy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journeyman
    ports: ["6032:5432"]
    volumes: ["${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6079:6379"]
    volumes: ["${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  conductor:
    image: orkesio/orkes-conductor-community-standalone:latest
    ports:
      - "6008:8080"
      - "6005:5000"
    environment:
      - CONFIG_PROP=/app/config/conductor.properties
    volumes:
      - ./infra/conductor-config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Bridges the host Docker socket to TCP so the worker (a TCP-only Docker client) drives
  # the host's OWN Docker daemon — sandboxes run as siblings, not nested (no DinD, no
  # privileged). Reachable ONLY on the private compose network at tcp://dockerproxy:2375.
  # SECURITY: exposes the full, unauthenticated Docker API (root-equivalent on the host).
  # Do NOT publish this port. Local/trusted deployments only.
  dockerproxy:
    image: alpine/socat
    # -t86400: after one direction of the relay reaches EOF, wait this long (vs socat's
    # 0.5s default) before closing the other. The worker's Docker `exec` is a HIJACKED
    # bidirectional stream: dockerode writes the runner's stdin then half-closes it, but
    # the runner needs seconds (boot opencode, run the model) before it writes its JSON
    # response on stdout. With the 0.5s default, socat tore down the stdout direction
    # before that response arrived → "runner produced no JSON (exit -1)". Keep it large.
    command: ["-t86400", "tcp-listen:2375,fork,reuseaddr", "unix-connect:/var/run/docker.sock"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Bundled local registry for the runner kit (zero-config default for
  # JOURNEYMAN_REGISTRY=localhost:5500). Standalone + published: `localhost:5500` resolves
  # to it from the host (build:kit push) and from the host Docker daemon (pull, when
  # provisioning sandboxes). External registries (GHCR/GitLab/ECR): point JOURNEYMAN_REGISTRY
  # elsewhere and ignore this service. 5500 (not 5000) avoids the macOS AirPlay clash.
  registry:
    image: registry:2
    ports: ["5500:5000"]
    volumes:
      - registry-storage:/var/lib/registry

  migrations:
    image: journeyman/migrations:dev
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── api-app: authenticated UI REST + SSE (the bulk of /api/*) ──────────────
  api-app:
    image: journeyman/api-server:dev
    command: ["npm", "run", "start:app", "-w", "@journeyman/api-server"]
    env_file: .env.production
    # Lets the Builder LLM reach a host service (e.g. LM Studio); Docker Desktop
    # maps host.docker.internal automatically, the alias makes Linux engines too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      IDENTITY_ENFORCE: "true"
      NODE_ENV: production
      # Local prod-sim: verbose logs to surface issues easily. Remove to revert
      # to the default "info" level.
      LOG_LEVEL: "debug"
      PORT: "4000"
      # Skill installs (git clone) run in-process here; clones land in the SAME
      # shared data root the worker reads from. Mounted to /data/journeyman below.
      JOURNEYMAN_BASE_DIR: /data/journeyman
    ports: ["6000:4000"]
    volumes:
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started

  # ── api-webhooks: public inbound receiver only (POST /webhooks/in/*) ────────
  api-webhooks:
    image: journeyman/api-server:dev
    command: ["npm", "run", "start:webhooks", "-w", "@journeyman/api-server"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      IDENTITY_ENFORCE: "true"
      NODE_ENV: production
      LOG_LEVEL: "debug"
      WEBHOOKS_PORT: "4001"
      JOURNEYMAN_BASE_DIR: /data/journeyman
    ports: ["6001:4001"]
    volumes:
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started

  # ── api-control-plane: SINGLETON background loops, no public API ────────────
  api-control-plane:
    image: journeyman/api-server:dev
    command: ["npm", "run", "start:control-plane", "-w", "@journeyman/api-server"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      NODE_ENV: production
      LOG_LEVEL: "debug"
      CONTROL_PLANE_PORT: "4003"
      JOURNEYMAN_BASE_DIR: /data/journeyman
    volumes:
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started

  analytics:
    image: journeyman/analytics:dev
    # env_file carries the same identity/JWT secret api-server uses, so the
    # analytics service verifies auth tokens with the same key.
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      IDENTITY_ENFORCE: "true"
      NODE_ENV: production
      LOG_LEVEL: "debug"
      # Dedicated var — the shared PORT (4000) belongs to api-server.
      ANALYTICS_PORT: "4002"
    ports: ["6002:4002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrations:
        condition: service_completed_successfully

  worker:
    image: journeyman/worker:dev
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      # Inside the container the data root is always /data/journeyman (the mount target
      # below). The host folder behind it is set via JOURNEYMAN_BASE_DIR in .env.
      JOURNEYMAN_BASE_DIR: /data/journeyman
      LOG_LEVEL: "debug"
      # Local-sandbox AI runs in-process as root here; the Claude engine refuses
      # bypassPermissions as root unless IS_SANDBOX=1.
      IS_SANDBOX: "1"
    volumes:
      # Host side = JOURNEYMAN_BASE_DIR from .env (default ./.journeyman-data);
      # mounted to the fixed in-container root /data/journeyman.
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started
      dockerproxy:
        condition: service_started
      registry:
        condition: service_started

  web:
    image: journeyman/web:dev
    ports: ["6080:8080"]
    depends_on:
      api-app:
        condition: service_healthy

  # ── logging stack: Loki (store+retain) + Alloy (collect) + Grafana (UI) ──────
  # Aggregates ALL container logs on the host daemon — named services AND the
  # ephemeral sandbox runners the worker spawns. Local prod-simulation only:
  # Loki auth is off and Grafana allows anonymous viewing. See docs/superpowers/
  # specs/2026-06-22-logging-stack-design.md.
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/logging/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/loki:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  alloy:
    image: grafana/alloy:v1.10.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./infra/logging/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/grafana:/var/lib/grafana
    ports: ["6300:3000"]
    depends_on:
      loki:
        condition: service_healthy

volumes:
  # postgres + redis data are host bind-mounts under JOURNEYMAN_BASE_DIR (see the
  # postgres/redis services) — durable across `down -v`/compose:reset.
  # Bundled local registry storage (runner kit images). Safe to wipe/rebuild.
  registry-storage:
