# compose.deploy.yml — FULL Journeyman deployment (infra + all apps).
# Run with: npm run compose:up / compose:down / compose:reset
# For the dev-only dependency stack (postgres+redis+conductor) see infra/compose.dev.yml.
# Host ports use a 6000 series to avoid clashing with the dev stack.
# Container ports are unchanged, so in-network URLs stay standard.
name: journeyman-deploy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journeyman
    ports: ["6032:5432"]
    volumes: ["${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6079:6379"]
    volumes: ["${JOURNEYMAN_BASE_DIR:-./.journeyman-data}/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  conductor:
    image: orkesio/orkes-conductor-community-standalone:latest
    ports:
      - "6008:8080"
      - "6005:5000"
    environment:
      - CONFIG_PROP=/app/config/conductor.properties
    volumes:
      - ./infra/conductor-config:/app/config
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Bridges the host Docker socket to TCP so the worker (a TCP-only Docker client) drives
  # the host's OWN Docker daemon — sandboxes run as siblings, not nested (no DinD, no
  # privileged). Reachable ONLY on the private compose network at tcp://dockerproxy:2375.
  # SECURITY: exposes the full, unauthenticated Docker API (root-equivalent on the host).
  # Do NOT publish this port. Local/trusted deployments only.
  dockerproxy:
    image: alpine/socat
    # -t86400: after one direction of the relay reaches EOF, wait this long (vs socat's
    # 0.5s default) before closing the other. The worker's Docker `exec` is a HIJACKED
    # bidirectional stream: dockerode writes the runner's stdin then half-closes it, but
    # the runner needs seconds (boot opencode, run the model) before it writes its JSON
    # response on stdout. With the 0.5s default, socat tore down the stdout direction
    # before that response arrived → "runner produced no JSON (exit -1)". Keep it large.
    command: ["-t86400", "tcp-listen:2375,fork,reuseaddr", "unix-connect:/var/run/docker.sock"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Bundled local registry for the runner kit (zero-config default for
  # JOURNEYMAN_REGISTRY=localhost:5500). Standalone + published: `localhost:5500` resolves
  # to it from the host (build:kit push) and from the host Docker daemon (pull, when
  # provisioning sandboxes). External registries (GHCR/GitLab/ECR): point JOURNEYMAN_REGISTRY
  # elsewhere and ignore this service. 5500 (not 5000) avoids the macOS AirPlay clash.
  registry:
    image: registry:2
    ports: ["5500:5000"]
    volumes:
      - registry-storage:/var/lib/registry

  migrations:
    image: journeyman/migrations:dev
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-server:
    image: journeyman/api-server:dev
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      IDENTITY_ENFORCE: "true"
      # Browser reaches the app over HTTPS (Cloudflare Tunnel); production mode
      # makes auth cookies set the Secure flag (see identity/src/middleware.ts).
      NODE_ENV: production
      PORT: "4000"
      # Skill installs (git clone) run in-process here; clones must land in the
      # SAME shared data root the worker reads from, so it resolves skills at the
      # persisted local_path. Mounted to /data/journeyman below (matches worker).
      JOURNEYMAN_BASE_DIR: /data/journeyman
    ports: ["6000:4000"]
    volumes:
      # Shared with the worker so skill clones written here are visible at the
      # same local_path when the worker runs the AI (see worker volume below).
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started

  worker:
    image: journeyman/worker:dev
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/journeyman
      CONDUCTOR_BASE_URL: http://conductor:8080/api
      # Inside the container the data root is always /data/journeyman (the mount target
      # below). The host folder behind it is set via JOURNEYMAN_BASE_DIR in .env.
      JOURNEYMAN_BASE_DIR: /data/journeyman
      # Local-sandbox AI runs in-process as root here; the Claude engine refuses
      # bypassPermissions as root unless IS_SANDBOX=1.
      IS_SANDBOX: "1"
    volumes:
      # Host side = JOURNEYMAN_BASE_DIR from .env (default ./.journeyman-data);
      # mounted to the fixed in-container root /data/journeyman.
      - ${JOURNEYMAN_BASE_DIR:-./.journeyman-data}:/data/journeyman
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      conductor:
        condition: service_started
      dockerproxy:
        condition: service_started
      registry:
        condition: service_started

  web:
    image: journeyman/web:dev
    ports: ["6080:8080"]
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  # postgres + redis data are host bind-mounts under JOURNEYMAN_BASE_DIR (see the
  # postgres/redis services) — durable across `down -v`/compose:reset.
  # Bundled local registry storage (runner kit images). Safe to wipe/rebuild.
  registry-storage:
